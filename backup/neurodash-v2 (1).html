<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroDash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --side:#f7f7f5; --main:#ffffff; --surface:#ffffff; --surface-2:#fafaf9; --surface-3:#f2f2ef; --hover:#f4f4f1;
  --ink:#171717; --ink-2:#525252; --ink-3:#8a8a86; --ink-4:#b3b3ae;
  --line:#ebebe7; --line-2:#dcdcd6; --grid:#efefeb; --axis:#cfcfc8;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 16px 40px -8px rgba(0,0,0,.18), 0 4px 10px -4px rgba(0,0,0,.08);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --seq-1:#dbe8fa; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#256abf; --seq-5:#184f95;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --idle:#a3a39e;
  --good-ink:#0a7a0a; --warn-ink:#8a5a00; --serious-ink:#a3451f; --crit-ink:#b42323;
  --good-bg:#ecf7ec; --warn-bg:#fdf5e1; --serious-bg:#fdefe8; --crit-bg:#fcebeb; --neutral-bg:#f0f0ec;
  --brand:#0f766e;
  --accent:#0f766e; --accent-ink:#0f766e; --accent-bg:#e7f4f2; --on-accent:#ffffff;
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
[data-role="therapist"]{ --accent:#0f766e; --accent-ink:#0f766e; --accent-bg:#e7f4f2; }
[data-role="consultant"]{ --accent:#4f46e5; --accent-ink:#4338ca; --accent-bg:#eeedfd; }
[data-role="engineer"]{ --accent:#c2410c; --accent-ink:#b23c0b; --accent-bg:#fdf0e7; }
[data-role="admin"]{ --accent:#334155; --accent-ink:#334155; --accent-bg:#eef0f3; }
:root[data-theme="dark"]{
  color-scheme: dark;
  --side:#121211; --main:#181817; --surface:#1d1d1c; --surface-2:#212120; --surface-3:#292927; --hover:#242423;
  --ink:#f2f2ef; --ink-2:#bdbdb6; --ink-3:#8a8a84; --ink-4:#5c5c58;
  --line:#2a2a28; --line-2:#363633; --grid:#262624; --axis:#42423e;
  --shadow-sm:none; --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --seq-1:#1d2a3b; --seq-2:#1c4270; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;
  --good-ink:#3cc23c; --warn-ink:#f5b83d; --serious-ink:#ef9672; --crit-ink:#f07575;
  --good-bg:rgba(12,163,12,.14); --warn-bg:rgba(250,178,25,.13); --serious-bg:rgba(236,131,90,.14); --crit-bg:rgba(208,59,59,.17); --neutral-bg:#2a2a28;
  --on-accent:#111110; --brand:#2dd4bf;
}
:root[data-theme="dark"] [data-role="therapist"]{ --accent:#2dd4bf; --accent-ink:#5eead4; --accent-bg:rgba(45,212,191,.11); }
:root[data-theme="dark"] [data-role="consultant"]{ --accent:#818cf8; --accent-ink:#a5b4fc; --accent-bg:rgba(129,140,248,.13); }
:root[data-theme="dark"] [data-role="engineer"]{ --accent:#fb923c; --accent-ink:#fdba74; --accent-bg:rgba(251,146,60,.12); }
:root[data-theme="dark"] [data-role="admin"]{ --accent:#94a3b8; --accent-ink:#cbd5e1; --accent-bg:rgba(148,163,184,.13); }

[data-density="low"]   { --fs:14.5px; --fs-sm:13.5px; --fs-xs:12.5px; --pad:20px; --gap:20px; --row:13px; --h1:24px; }
[data-density="medium"]{ --fs:14px;   --fs-sm:13px;   --fs-xs:12px;   --pad:18px; --gap:16px; --row:10px; --h1:22px; }
[data-density="high"]  { --fs:13px;   --fs-sm:12.5px; --fs-xs:11.5px; --pad:14px; --gap:12px; --row:7px;  --h1:20px; }

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--main); color:var(--ink); font-family:var(--font); font-size:var(--fs,14px); line-height:1.45; -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01"; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:inherit; text-decoration:none; }
a.lnk, .lnk{ color:var(--accent-ink); } a.lnk:hover{ text-decoration:underline; }
.num{ font-variant-numeric:tabular-nums; } .mono{ font-family:var(--mono); font-size:.92em; }
.muted{ color:var(--ink-3); } .soft{ color:var(--ink-2); } .sm{ font-size:var(--fs-sm); } .xs{ font-size:var(--fs-xs); }
.nowrap{ white-space:nowrap; } .hidden{ display:none !important; } .grow{ flex:1; }
.row{ display:flex; align-items:center; gap:8px; } .col{ display:flex; flex-direction:column; }
.up{ color:var(--good-ink); } .down{ color:var(--crit-ink); }

/* ============ LOGIN ============ */
.login{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; background:var(--side); }
.login-logo{ display:flex; align-items:center; gap:10px; font-weight:650; font-size:19px; letter-spacing:-.02em; margin-bottom:26px; }
.logo{ width:30px; height:30px; border-radius:8px; background:var(--brand); color:#fff; display:grid; place-items:center; flex:none; }
:root[data-theme="dark"] .logo{ color:#0b0b0b; }
.login-card{ width:380px; max-width:100%; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:30px 30px 26px; box-shadow:var(--shadow-lg); }
.login-card h1{ font-size:20px; margin:0 0 4px; font-weight:650; letter-spacing:-.015em; }
.login-card > p{ margin:0 0 22px; color:var(--ink-2); font-size:14px; }
.login-card .field input{ padding:10px 12px; }
.pw{ position:relative; } .pw input{ width:100%; padding-right:60px !important; }
.pw button{ position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--ink-3); font-size:12.5px; cursor:pointer; padding:4px 6px; }
.login-row{ display:flex; justify-content:space-between; align-items:center; margin:2px 0 20px; font-size:13px; }
.login-row label{ display:flex; gap:7px; align-items:center; color:var(--ink-2); cursor:pointer; }
.login-err{ display:flex; gap:8px; align-items:flex-start; background:var(--crit-bg); color:var(--crit-ink); border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:16px; }
.btn.block{ width:100%; justify-content:center; padding:10px 14px; font-size:14px; }
.login-foot{ margin-top:22px; font-size:12px; color:var(--ink-3); display:flex; gap:14px; }

/* ============ SHELL ============ */
.shell{ display:grid; grid-template-columns:244px minmax(0,1fr); min-height:100vh; }
.side{ background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding:10px 10px 8px; }
.ws{ display:flex; align-items:center; gap:10px; padding:8px 8px 10px; }
.ws b{ display:block; font-size:14px; font-weight:650; letter-spacing:-.01em; line-height:1.2; }
.ws div > span{ font-size:12px; color:var(--ink-3); }
.searchbtn{ display:flex; align-items:center; gap:8px; width:100%; padding:7px 10px; margin:4px 0 10px; border:1px solid var(--line-2); border-radius:8px; background:var(--surface); color:var(--ink-3); cursor:pointer; font-size:13px; }
.searchbtn:hover{ border-color:var(--ink-4); }
.kbd{ margin-left:auto; font-size:11px; border:1px solid var(--line-2); border-radius:5px; padding:0 5px; color:var(--ink-3); font-family:var(--font); }
.nav{ display:flex; flex-direction:column; gap:1px; flex:1; overflow-y:auto; }
.nav a{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; color:var(--ink-2); font-weight:500; font-size:13.5px; }
.nav a svg{ color:var(--ink-3); flex:none; }
.nav a:hover{ background:var(--hover); color:var(--ink); }
.nav a.on{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line), var(--shadow-sm); }
.nav a.on svg{ color:var(--accent); }
.nav .cnt{ margin-left:auto; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.nav .cnt.hot{ background:var(--crit); color:#fff; border-radius:99px; padding:0 6px; font-weight:600; }
.nav .sec{ font-size:11.5px; color:var(--ink-3); padding:16px 10px 5px; font-weight:500; }
.userbtn{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px; border:0; background:none; cursor:pointer; text-align:left; width:100%; }
.userbtn:hover{ background:var(--hover); }
.userbtn b{ display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.userbtn div > span{ display:block; font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.av{ width:30px; height:30px; border-radius:50%; background:var(--accent-bg); color:var(--accent-ink); display:grid; place-items:center; font-weight:600; font-size:11.5px; flex:none; letter-spacing:.02em; }
.av.sm{ width:22px; height:22px; font-size:9.5px; } .av.lg{ width:48px; height:48px; font-size:16px; }
.avs{ display:flex; } .avs .av{ box-shadow:0 0 0 2px var(--surface); } .avs .av + .av{ margin-left:-6px; }

.main{ min-width:0; display:flex; flex-direction:column; background:var(--main); }
.top{ height:52px; display:flex; align-items:center; gap:10px; padding:0 28px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; background:var(--main); }
.crumbs{ display:flex; gap:7px; align-items:center; font-size:13.5px; color:var(--ink-3); min-width:0; }
.crumbs a:hover{ color:var(--ink); } .crumbs b{ color:var(--ink); font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sync{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-3); margin-right:6px; }
.back{ display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--ink-3); margin-bottom:14px; }
.back:hover{ color:var(--ink); }
.ws .icon-btn{ margin-right:-4px; }
.srow{ display:grid; grid-template-columns:56px minmax(0,1fr) auto 168px; gap:16px; align-items:center; padding:15px var(--pad); border-bottom:1px solid var(--line); cursor:pointer; }
.srow:last-child{ border-bottom:0; } .srow:hover{ background:var(--hover); }
.srow .st{ font-variant-numeric:tabular-nums; font-weight:600; }
.srow .sp2{ min-width:0; } .srow .sp2 b{ display:block; font-weight:600; }
.srow .sp2 > span{ display:block; font-size:12.5px; color:var(--ink-3); margin-top:1px; }
.srow .sr{ font-size:13px; text-align:right; white-space:nowrap; } .srow .ss{ text-align:right; }
.srow.done .st{ color:var(--ink-3); font-weight:500; }
.srow.now{ box-shadow:inset 3px 0 0 var(--accent); background:color-mix(in srgb, var(--accent-bg) 45%, transparent); }
.content{ padding:32px 32px 64px; width:100%; max-width:1480px; }
[data-density="low"] .content{ max-width:1240px; }

.icon-btn{ border:0; background:transparent; width:32px; height:32px; border-radius:7px; display:grid; place-items:center; cursor:pointer; color:var(--ink-2); position:relative; flex:none; }
.icon-btn:hover{ background:var(--hover); color:var(--ink); }
.icon-btn .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--crit); box-shadow:0 0 0 2px var(--main); }

/* popovers */
.pop{ position:fixed; z-index:70; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); }
.menu{ width:250px; padding:6px; }
.menu .mi{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; cursor:pointer; font-size:13.5px; color:var(--ink); width:100%; border:0; background:none; text-align:left; }
.menu .mi:hover{ background:var(--hover); }
.menu .mh{ padding:8px 10px 10px; border-bottom:1px solid var(--line); margin-bottom:6px; }
.menu .mh b{ display:block; font-size:13.5px; } .menu .mh span{ font-size:12.5px; color:var(--ink-3); }
.menu hr{ border:0; border-top:1px solid var(--line); margin:6px 0; }
.notif{ width:390px; max-height:70vh; display:flex; flex-direction:column; }
.notif-h{ display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); gap:8px; }
.notif-h b{ flex:1; font-size:14px; }
.notif-b{ overflow-y:auto; }
.ni{ display:flex; gap:11px; padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
.ni:hover{ background:var(--hover); } .ni:last-child{ border-bottom:0; }
.ni .t{ font-size:13.5px; font-weight:500; } .ni .d{ font-size:12.5px; color:var(--ink-2); margin-top:1px; } .ni .w{ font-size:11.5px; color:var(--ink-3); margin-top:3px; }
.ni.unread .t:before{ content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin:0 6px 2px 0; }

/* command palette */
.cmdk-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:80; display:flex; justify-content:center; padding-top:12vh; }
.cmdk{ width:600px; max-width:calc(100% - 32px); background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); overflow:hidden; height:fit-content; }
.cmdk input{ width:100%; border:0; border-bottom:1px solid var(--line); padding:16px 18px; font-size:15.5px; outline:none; background:transparent; }
.cmdk-list{ max-height:380px; overflow-y:auto; padding:6px; }
.cmdk-g{ font-size:11.5px; color:var(--ink-3); padding:8px 12px 4px; font-weight:500; }
.cmdk-i{ display:flex; gap:10px; align-items:center; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px; }
.cmdk-i span.sub{ color:var(--ink-3); font-size:12.5px; margin-left:auto; }
.cmdk-i.sel{ background:var(--hover); }

/* ============ PAGE ============ */
.ph{ display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; min-height:36px; }
.ph h1{ font-size:var(--h1); margin:0; font-weight:650; letter-spacing:-.02em; line-height:1.2; }
.ph .meta{ color:var(--ink-3); font-size:13.5px; margin-top:2px; }
.ph .sp{ flex:1; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.grid{ display:grid; gap:var(--gap); }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); } .g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.g-main{ grid-template-columns:minmax(0,1fr) 340px; } .g-wide{ grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); }
.stack{ display:flex; flex-direction:column; gap:var(--gap); min-width:0; }
.mb{ margin-bottom:var(--gap); }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; min-width:0; }
.card-h{ display:flex; align-items:center; gap:10px; padding:12px var(--pad); border-bottom:1px solid var(--line); min-height:46px; }
.card-h h2{ font-size:13.5px; font-weight:600; margin:0; }
.card-h .sub{ font-size:12.5px; color:var(--ink-3); }
.card-h .sp{ flex:1; }
.card-b{ padding:var(--pad); } .card-b.flush{ padding:0; }
.card.plain .card-h{ border-bottom:0; padding-bottom:0; }

/* stat strip */
.stats{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border:1px solid var(--line); border-radius:10px; background:var(--surface); margin-bottom:var(--gap); overflow:hidden; }
.stat{ padding:14px var(--pad); border-left:1px solid var(--line); min-width:0; }
.stat:first-child{ border-left:0; }
.stat.link{ cursor:pointer; } .stat.link:hover{ background:var(--hover); }
.stat .l{ font-size:12.5px; color:var(--ink-3); display:flex; align-items:center; gap:6px; white-space:nowrap; }
.stat .v{ font-size:24px; font-weight:600; letter-spacing:-.02em; margin-top:3px; line-height:1.2; }
[data-density="high"] .stat .v{ font-size:21px; }
.stat .v small{ font-size:13px; color:var(--ink-3); font-weight:500; margin-left:3px; letter-spacing:0; }
.stat .f{ font-size:12px; color:var(--ink-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat.bad .v{ color:var(--crit-ink); } .stat.warnv .v{ color:var(--warn-ink); }

/* pills & badges */
.pill{ display:inline-flex; align-items:center; gap:6px; padding:1px 8px 1px 7px; border-radius:99px; font-size:var(--fs-xs); font-weight:500; white-space:nowrap; line-height:1.7; border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface); }
.pill .d{ width:7px; height:7px; border-radius:50%; background:var(--idle); flex:none; }
.pill.good .d{ background:var(--good); } .pill.warn .d{ background:var(--warn); } .pill.serious .d{ background:var(--serious); } .pill.crit .d{ background:var(--crit); } .pill.accent .d{ background:var(--accent); } .pill.info .d{ background:var(--series-1); }
.pill.live .d{ box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.tag{ display:inline-flex; align-items:center; gap:5px; padding:1px 7px; border-radius:5px; font-size:var(--fs-xs); font-weight:500; background:var(--surface-3); color:var(--ink-2); white-space:nowrap; line-height:1.7; }
.tag.crit{ background:var(--crit-bg); color:var(--crit-ink); } .tag.serious{ background:var(--serious-bg); color:var(--serious-ink); } .tag.warn{ background:var(--warn-bg); color:var(--warn-ink); } .tag.good{ background:var(--good-bg); color:var(--good-ink); } .tag.accent{ background:var(--accent-bg); color:var(--accent-ink); }
.sev{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-xs); font-weight:550; white-space:nowrap; }
.sev i{ display:inline-flex; gap:1.5px; align-items:flex-end; height:11px; }
.sev i b{ width:3px; border-radius:1px; background:var(--line-2); }
.sev i b:nth-child(1){ height:4px; } .sev i b:nth-child(2){ height:7px; } .sev i b:nth-child(3){ height:10px; }
.sev.Low i b:nth-child(1){ background:var(--ink-3); }
.sev.Medium i b:nth-child(-n+2){ background:var(--warn); }
.sev.High i b{ background:var(--serious); }
.sev.Critical{ color:var(--crit-ink); } .sev.Critical i b{ background:var(--crit); }
.delta{ white-space:nowrap; font-size:var(--fs-xs); font-weight:600; padding:0 5px; border-radius:4px; font-variant-numeric:tabular-nums; }
.delta.up{ background:var(--good-bg); } .delta.down{ background:var(--crit-bg); } .delta.flat{ background:var(--surface-3); color:var(--ink-2); }

/* tables */
.tbl-wrap{ overflow-x:auto; }
table.tbl{ width:100%; border-collapse:collapse; font-size:var(--fs-sm); }
.tbl th{ text-align:left; font-weight:500; color:var(--ink-3); font-size:12px; padding:8px var(--pad); border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2); }
.tbl th.sortable{ cursor:pointer; } .tbl th.sortable:hover{ color:var(--ink); }
.tbl td{ padding:var(--row) var(--pad); border-bottom:1px solid var(--line); vertical-align:middle; }
.tbl tbody tr:last-child td{ border-bottom:0; }
.tbl tr.click{ cursor:pointer; } .tbl tr.click:hover td{ background:var(--hover); }
.tbl td.r,.tbl th.r{ text-align:right; }
.tbl .pri{ font-weight:550; color:var(--ink); white-space:nowrap; } .tbl .sec2{ font-size:12px; color:var(--ink-3); margin-top:1px; }
.tbl-foot{ display:flex; justify-content:space-between; align-items:center; padding:10px var(--pad); border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-3); }
.who{ display:flex; align-items:center; gap:10px; min-width:0; }

/* buttons & inputs */
.btn{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:7px; border:1px solid var(--line-2); background:var(--surface); cursor:pointer; font-weight:500; font-size:13px; white-space:nowrap; box-shadow:var(--shadow-sm); line-height:1.45; }
.btn:hover{ background:var(--hover); }
.btn.pri{ background:var(--accent); border-color:transparent; color:var(--on-accent); }
.btn.pri:hover{ filter:brightness(1.08); }
.btn.dark{ background:var(--ink); color:var(--main); border-color:transparent; }
.btn.sm{ padding:3px 9px; font-size:12.5px; }
.btn.ghost{ border-color:transparent; background:transparent; box-shadow:none; color:var(--ink-2); }
.btn.ghost:hover{ background:var(--hover); color:var(--ink); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-size:13px; font-weight:500; color:var(--ink); }

<script>
'use strict';
/* =====================================================================
   1. UTILITIES
   ===================================================================== */
let _seed = 20260918;
function RNG(){ _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rand = (a,b) => a + RNG()*(b-a);
const randInt = (a,b) => Math.floor(rand(a, b+1));
const pick = a => a[Math.floor(RNG()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const gauss = () => { let u = 0; while(!u) u = RNG(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*RNG()); };
const round1 = v => Math.round(v*10)/10;
const DAY = 86400000;
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const NOW = new Date();
const addDays = (d,n) => new Date(d.getTime() + n*DAY);
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const daysAgo = d => Math.floor((TODAY - startOfDay(d)) / DAY);
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD = d => d.getDate() + ' ' + MONTHS[d.getMonth()];
const fmtDY = d => d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
const fmtT = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
function rel(d){
  const ms = NOW - d, h = ms/3600000;
  if (h < 0) { const dd = Math.ceil(-ms/DAY); return 'in ' + dd + ' d'; }
  if (h < 1) return Math.max(1, Math.round(h*60)) + ' min ago';
  if (h < 24) return Math.round(h) + ' h ago';
  const dd = Math.round(h/24); return dd === 1 ? 'yesterday' : dd + ' d ago';
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => Math.round(v*100) + '%';
let _uid = 1000; const uid = p => p + '-' + (++_uid);

/* =====================================================================
   2. REFERENCE DATA  (all devices are placeholders for the demo)
   ===================================================================== */
const SCALES = {
  'FMA-UE': { name:'Fugl-Meyer Upper Extremity', max:66, mcid:5 },
  'BBS':    { name:'Berg Balance Scale',          max:56, mcid:4 },

const DEVICE_TYPES = [
  { id:'PLUTO',  name:'Pluto',  category:'Wrist & Hand Robot',            scale:'FMA-UE', outUnit:'Nm', outLimit:1.2, units:4,
    mechanisms:['Wrist Flex/Ext','Pronation/Supination','Hand Open/Close'], games:['HAT','FruitBasket','PongGame'] },
  { id:'MARS',   name:'Mars',   category:'Arm Support Robot',             scale:'FMA-UE', outUnit:'Nm', outLimit:8.0, units:3,
    mechanisms:['Shoulder Flexion','Elbow Extension','Reach & Grasp'], games:['PongGame','TukTuk'] },
  { id:'ORION',  name:'Orion',  category:'Grip & Pinch Trainer',          scale:'FMA-UE', outUnit:'N',  outLimit:60,  units:2,
    mechanisms:['Cylindrical Grip','Pinch Grip','Finger Extension'], games:['RNR','HatRick'] },
  { id:'VEGA',   name:'Vega',   category:'Balance & Lower-Limb Trainer',  scale:'BBS',    outUnit:'N',  outLimit:400, units:2,
    mechanisms:['Weight Shift','Ankle Dorsiflexion','Sit-to-Stand'], games:['TukTuk','PongGame'] },
  { id:'COSMOS', name:'Cosmos', category:'Fine Motor Game Station',       scale:'FMA-UE', outUnit:'N',  outLimit:25,  units:2,
    mechanisms:['Precision Reach','Bimanual Coordination'], games:['FruitBasket','HatRick'] },
  { id:'ATLAS',  name:'Atlas',  category:'Shoulder & Scapular Robot',     scale:'FMA-UE', outUnit:'Nm', outLimit:12,  units:1,
    mechanisms:['Shoulder Abduction','Scapular Stabilisation'], games:['HAT','RNR'] },
];
const GAME_LABELS = { HAT:'Hand Trainer Arcade', PongGame:'Pong', FruitBasket:'Fruit Basket', RNR:'Reach & Retrieve', TukTuk:'TukTuk Drive', HatRick:'HatRick Precision' };
const typeOf = id => DEVICE_TYPES.find(t => t.id === id);
const ROOMS = ['Therapy Bay 1','Therapy Bay 2','Therapy Bay 3','Gait & Balance Lab'];

const USERS = [
  { id:'U-T1', role:'therapist',  name:'Priya Nair',    title:'Senior Occupational Therapist', initials:'PN' },
  { id:'U-T2', role:'therapist',  name:'Rohan Mehta',   title:'Physiotherapist',               initials:'RM' },
  { id:'U-T3', role:'therapist',  name:'Ananya Kapoor', title:'Occupational Therapist',        initials:'AK' },
  { id:'U-T4', role:'therapist',  name:'Farah Sheikh',  title:'Physiotherapist',               initials:'FS' },
  { id:'U-C1', role:'consultant', name:'Vikram Suresh', title:'Neuro-rehabilitation Consultant', initials:'VS' },
  { id:'U-C2', role:'consultant', name:'Leela Menon',   title:'Consultant, Stroke Recovery',   initials:'LM' },
  { id:'U-E1', role:'engineer',   name:'Arjun Rao',     title:'Device engineer · Pluto, Mars', initials:'AR', owns:['PLUTO','MARS'] },
  { id:'U-E2', role:'engineer',   name:"Kevin D'Souza", title:'Device engineer · Orion, Vega', initials:'KD', owns:['ORION','VEGA'] },
  { id:'U-E3', role:'engineer',   name:'Meera Iyer',    title:'Device engineer · Cosmos, Atlas', initials:'MI', owns:['COSMOS','ATLAS'] },
  { id:'U-A1', role:'admin',      name:'Sam Thomas',    title:'System administrator',          initials:'ST' },

const DEMO_PASSWORD = 'neuro@123';   // same for every account in the prototype
const userOf = id => USERS.find(u => u.id === id);
const usersByRole = r => USERS.filter(u => u.role === r);
const ownerOfType = typeId => USERS.find(u => u.owns && u.owns.includes(typeId));

const ROLE_INFO = {
  therapist:  { label:'Therapist',  density:'low',    question:'Who do I need to act on today?',        blurb:'Today’s patients, sessions and what needs action' },
  consultant: { label:'Consultant', density:'medium', question:'Which patients are not progressing?',   blurb:'Progress review across all patients' },
  engineer:   { label:'Engineer',   density:'high',   question:'Which of my devices are unsafe or unavailable?', blurb:'Your devices: health, performance, usage, outcomes' },
  admin:      { label:'Admin',      density:'medium', question:'Is the whole programme running?',       blurb:'Superuser: everything, plus users and audit' },
};

/* =====================================================================
   3. GENERATED DEMO DATA
   ===================================================================== */
const DB = { units:[], patients:[], sessions:[], assessments:[], faults:[], requests:[], audit:[], calibrations:[] };

/* ---- device units ---- */
DEVICE_TYPES.forEach(t => {
  for (let i = 1; i <= t.units; i++) {
    DB.units.push({
      id: t.id + '-0' + i, typeId: t.id, serial: 'SN-' + t.id.slice(0,2) + randInt(20400, 20999),

function makeSession(p, d, idx, totalDays){
  const u = unitOf(p.plan.unitId), t = typeOf(p.plan.typeId);
  const minutes = Math.round(p.plan.minutes * rand(0.7, 1.1));
  const prog = clamp(idx / Math.max(20, totalDays), 0, 1);
  const agoD = daysAgo(d);
  const drift = u.anomaly && agoD < 10 ? (10 - agoD) * 0.12 : 0;
  const trials = Math.round(minutes * rand(1.5, 2.3));
  const accuracy = clamp(52 + prog * 26 * (p.rate / 3) + gauss() * 6, 20, 98);
  const flags = u.anomaly && agoD < 10 ? randInt(1, 4) : (RNG() < 0.05 ? 1 : 0);
  return {
    id: uid('SS'), patientId: p.id, unitId: u.id, typeId: t.id, date: d,
    minutes, trials, accuracy: round1(accuracy), stars: Math.round(trials * accuracy / 100 / 3),
    game: pick(p.plan.games), mechanism: pick(p.plan.mechanisms),
    rom: round1(clamp(35 + prog * 25 * (p.rate / 3) + gauss() * 4, 10, 120)),
    trackErr: round1(u.errBase + Math.abs(gauss()) * 0.35 + drift),
    latency: Math.round(u.latBase + gauss() * 3 + (u.anomaly && agoD < 10 ? 6 : 0)),
    peakOut: round1(t.outLimit * clamp(rand(0.42, 0.8) + (u.anomaly && agoD < 5 ? 0.15 : 0), 0.2, 0.99)),
    flags, disconnects: RNG() < 0.04 ? 1 : 0,
  };
}

function unitStatus(u){
  const open = DB.faults.filter(f => f.unitId === u.id && OPEN_FAULT(f));
  const calDue = daysToCal(u), syncH = (NOW - u.lastSync) / 3600000;
  if (open.some(f => f.severity === 'Critical' || f.severity === 'High')) return 'Out of service';
  if (open.length || calDue < 0 || syncH > 24) return 'Needs attention';
  if (DB.patients.some(p => p.status === 'Active' && p.plan && p.plan.unitId === u.id)) return 'In use';
  return 'Available';
}
const daysToCal = u => u.calInterval - daysAgo(u.lastCal);
const STATUS_TONE = { 'Out of service':'crit', 'Needs attention':'warn', 'In use':'accent', 'Available':'good', 'Active':'accent', 'New':'good', 'Discharged':'', 'Critical':'crit', 'High':'serious', 'Medium':'warn', 'Low':'', 'Reported':'crit', 'Investigating':'warn', 'Resolved':'accent', 'Cleared for use':'good', 'Pending':'warn', 'Assigned':'good', 'Declined':'', 'Done':'good', 'In progress':'accent', 'Upcoming':'' };

function patientMetrics(p){
  const m = { sessions: DB.sessions.filter(s => s.patientId === p.id) };
  const as = DB.assessments.filter(a => a.patientId === p.id).sort((a, b) => a.date - b.date);
  m.assessments = as;
  m.baseline = as[0] ? as[0].score : null;
  m.latest = as.length ? as[as.length - 1] : null;
  m.change = as.length > 1 ? m.latest.score - m.baseline : null;
  m.lastDelta = as.length > 1 ? m.latest.score - as[as.length - 2].score : null;
  m.max = SCALES[p.scale].max;
  m.gainPct = m.change != null ? m.change / m.max * 100 : null;
  m.nextAssess = m.latest ? 14 - daysAgo(m.latest.date) : 0;
  if (p.plan && p.status === 'Active') {
    const win = (from, to) => {                     // planned vs done minutes over [from, to]
      let planned = 0, done = 0;
      for (let d = new Date(from); d <= to; d = addDays(d, 1)) { if (d.getDay() !== 0 && d >= startOfDay(p.plan.start)) planned += p.plan.minutes; }
      m.sessions.forEach(s => { const sd = startOfDay(s.date); if (sd >= from && sd <= to) done += s.minutes; });
      return planned ? done / planned : null;
    };
    m.adh7 = win(addDays(TODAY, -7), addDays(TODAY, -1));
    m.adhAll = win(startOfDay(p.plan.start), addDays(TODAY, -1));
    let y = addDays(TODAY, -1); if (y.getDay() === 0) y = addDays(y, -1);
    m.missedYesterday = y >= startOfDay(p.plan.start) && !m.sessions.some(s => dayKey(s.date) === dayKey(y));
    m.yesterday = y;
    m.minutes7 = m.sessions.filter(s => daysAgo(s.date) >= 1 && daysAgo(s.date) <= 7).reduce((a, s) => a + s.minutes, 0);
    m.notProgressing = as.length >= 3 && m.lastDelta <= 1;
    m.declining = as.length >= 2 && m.lastDelta < 0;
    m.lowAdh = m.adh7 != null && m.adh7 < 0.6;
    const u = p.plan.unitId ? unitOf(p.plan.unitId) : null;
    m.unitStatus = u ? unitStatus(u) : null;
  }
  return m;
}

function drawLine(spec, W, H){
  const M = { l: 38, r: spec.series.length <= 4 ? 44 : 14, t: 12, b: 24 };

};

function allowed(page){ if (DETAIL[page]) return DETAIL[page].includes(role()); return NAV[role()].some(n => Array.isArray(n) && n[0] === page); }

const plink = p => canSeePatient(p) ? `<a class="lnk" href="#/patient/${p.id}">${esc(pname(p))}</a>` : `<span class="mono">${esc(pname(p))}</span>`;
const ulink = u => canSeeUnit(u) ? `<a class="lnk mono nowrap" href="#/device/${u.id}">${esc(u.id)}</a>` : `<span class="mono nowrap">${esc(u.id)}</span>`;
const ptsTxt = n => Math.abs(n) + (Math.abs(n) === 1 ? ' pt' : ' pts');

function go(hash){ if (location.hash === hash) render(); else location.hash = hash; }
function parseHash(){ const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); return { page: parts[0], id: parts[1], tab: parts[2] }; }
function toast(msg){ document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = icon('check', 15) + esc(msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* modal forms */
function openModal({ title, sub, body, submit = 'Save', onSubmit }){
  const wrap = document.createElement('div'); wrap.className = 'scrim';
  wrap.innerHTML = `<form class="modal" autocomplete="off"><div class="modal-h"><div class="grow"><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div><button type="button" class="icon-btn" data-close>${icon('x')}</button></div><div class="modal-b">${body}</div><div class="modal-f"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">${submit}</button></div></form>`;
  const close = () => wrap.remove();
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-close]')) close(); });
  wrap.querySelector('form').addEventListener('submit', e => {
    e.preventDefault(); const fd = new FormData(e.target), o = {};
    for (const [k, v] of fd.entries()) { if (o[k] !== undefined) o[k] = [].concat(o[k], v); else o[k] = v; }
    if (onSubmit(o) !== false) { close(); render(); }
  });
  document.body.appendChild(wrap);
  const first = wrap.querySelector('input:not([disabled]),select,textarea'); if (first) first.focus();
}
const fld = (label, inner, hint) => `<div class="field"><label>${label}</label>${inner}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
const sel = (name, opts, cur) => `<select name="${name}">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${v == cur ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
const checks = (name, opts, cur = []) => `<div class="checks">${opts.map(o => `<label><input type="checkbox" name="${name}" value="${esc(o)}" ${cur.includes(o) ? 'checked' : ''}>${esc(GAME_LABELS[o] || o)}</label>`).join('')}</div>`;

function daily(arr, days, fn){
  const out = [];
  for (let k = days - 1; k >= 0; k--) { const d = addDays(TODAY, -k), key = dayKey(d), ss = arr.filter(s => dayKey(s.date) === key); out.push({ d, ss, value: fn(ss) }); }
  return out;
}
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const sum = a => a.reduce((x, y) => x + y, 0);
const inLast = (arr, days) => arr.filter(s => daysAgo(s.date) < days);
const dayBar = r => ({ label: String(r.d.getDate()), full: WD[r.d.getDay()] + ' ' + fmtD(r.d), value: r.value });
const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function calOffset(u, d){ let since = Math.round((d - u.lastCal) / DAY); if (since < 0) since += u.calInterval; return Math.round(Math.max(0, 0.05 + u.driftRate * since / 7 + 0.03 * Math.sin(+d / DAY * 0.9 + u.id.length)) * 100) / 100; }
const CAL_TOL = 0.5;
const unitSessions = u => DB.sessions.filter(s => s.unitId === u.id);
const typeLabel = id => { const t = typeOf(id); return t ? t.name : '—'; };
const sevOrder = { Critical: 0, High: 1, Medium: 2, Low: 3 };
const progDay = p => p.plan ? clamp(daysAgo(p.plan.start) + 1, 0, p.plan.weeks * 7) : 0;
const progCell = p => p.plan && p.status === 'Active' ? `<div class="prog"><div class="bar"><div style="width:${progDay(p) / (p.plan.weeks * 7) * 100}%"></div></div><span class="num">Day ${progDay(p)}<span class="muted">/${p.plan.weeks * 7}</span></span></div>` : '<span class="muted">—</span>';
function liveStatus(u){
  const s = unitStatus(u);
  if (s === 'Out of service') return s;
  if ((NOW - u.lastSync) / 3600000 > 24) return 'Offline';
  if (s === 'Needs attention') return s;
  if (DB.patients.some(p => p.slot && p.slot.state === 'In progress' && p.plan && p.plan.unitId === u.id)) return 'In session';
  return s;
}
const syncTxt = u => { const h = (NOW - u.lastSync) / 3600000; return h > 24 ? `<span class="down">${Math.round(h)} h ago</span>` : `<span class="soft">${h < 1 ? Math.max(1, Math.round(h * 60)) + ' min' : Math.round(h) + ' h'} ago</span>`; };
const calTxt = d => d < 0 ? `<span class="down">Overdue ${-d} d</span>` : d <= 7 ? `<span style="color:var(--warn-ink)">In ${d} d</span>` : `<span class="soft">In ${d} d</span>`;
const scoreCell = m => m.latest ? `<span class="nowrap"><span class="num"><b style="font-weight:600">${m.latest.score}</b><span class="muted">/${m.max}</span></span> ${delta(m.change)}</span>` : '<span class="muted">—</span>';
const flagTags = (p, m) => p.status !== 'Active' ? '' : reviewReasons(p, m).map(z => tag(z.text, z.tone)).join(' ') + (m.unitStatus === 'Out of service' ? ' ' + tag('Device down', 'crit') : '');

function therapistActions(){
  const out = [];
  DB.patients.filter(p => p.therapistId === me().id).forEach(p => {
    const href = '#/patient/' + p.id, nm = esc(p.name);
    if (p.status === 'Active') {
      const m = patientMetrics(p);
      if (m.unitStatus === 'Out of service') out.push({ key:'dev' + p.id, prio:0, tone:'crit', icon:'alert', title: nm + ' · device out of service', desc: esc(p.plan.unitId), href, action:`<button class="btn sm" data-act="requestDevice" data-pid="${p.id}">Request unit</button>` });
      if (m.declining) out.push({ key:'dec' + p.id, prio:1, tone:'crit', icon:'trend', title: nm + ' · ' + p.scale + ' down ' + ptsTxt(m.lastDelta), desc: 'Assessed ' + fmtD(m.latest.date) + ' · ' + m.latest.score + '/' + m.max, href, date: m.latest.date, action:`<button class="btn sm" data-act="modifyPlan" data-pid="${p.id}">Edit plan</button>` });
      else if (m.notProgressing) out.push({ key:'flat' + p.id, prio:3, tone:'serious', icon:'trend', title: nm + ' · no change since last assessment', desc: p.scale + ' ' + m.latest.score + '/' + m.max + ' on ' + fmtD(m.latest.date), href, date: m.latest.date, action:`<button class="btn sm" data-act="modifyPlan" data-pid="${p.id}">Edit plan</button>` });
      if (m.nextAssess <= 0) out.push({ key:'as' + p.id, prio:1, tone:'accent', icon:'clip', title: nm + ' · assessment ' + (m.nextAssess < 0 ? 'overdue' : 'due today'), desc: SCALES[p.scale].name + (m.nextAssess < 0 ? ' · ' + (-m.nextAssess) + ' d overdue' : ''), href, action:`<button class="btn sm" data-act="newAssessment" data-pid="${p.id}">Record</button>` });
      if (m.missedYesterday) out.push({ key:'miss' + p.id, prio:2, tone:'warn', icon:'clock', title: nm + ' · missed session', desc: WD[m.yesterday.getDay()] + ' ' + fmtD(m.yesterday), href, date: m.yesterday });
      if (m.lowAdh) out.push({ key:'adh' + p.id, prio:2, tone:'warn', icon:'pulse', title: nm + ' · low attendance', desc: m.minutes7 + ' of ' + Math.round(m.minutes7 / m.adh7) + ' planned minutes this week', href });
    }
    if (p.status === 'New') {
      const hasBase = DB.assessments.some(a => a.patientId === p.id), req = DB.requests.find(q => q.patientId === p.id);
      if (!hasBase) out.push({ key:'base' + p.id, prio:1, tone:'accent', icon:'clip', title: nm + ' · baseline assessment needed', desc:'Registered ' + fmtD(p.admitted), href, action:`<button class="btn sm" data-act="newAssessment" data-pid="${p.id}">Record</button>` });
      if (!p.plan) out.push({ key:'plan' + p.id, prio:2, tone:'accent', icon:'edit', title: nm + ' · therapy plan needed', desc:'New patient', href, action:`<button class="btn sm" data-act="modifyPlan" data-pid="${p.id}">Create plan</button>` });
      if (req && req.status === 'Assigned') out.push({ key:'rdy' + p.id, prio:4, tone:'good', icon:'check', title: nm + ' · ' + esc(req.unitId) + ' assigned', desc: 'Programme starts ' + fmtD(p.plan.start), href, date: req.date });
      if (req && req.status === 'Pending') out.push({ key:'wait' + p.id, prio:5, tone:'', icon:'clock', title: nm + ' · awaiting device', desc: typeLabel(req.typeId) + ' requested ' + rel(req.date), href, date: req.date });
    }
  });
  return out.sort((a, b) => a.prio - b.prio);
}

function viewToday(){
  const active = DB.patients.filter(p => p.therapistId === me().id && p.status === 'Active');
  const sched = active.filter(p => p.slot).sort((a, b) => a.slot.time - b.slot.time);
  const done = sched.filter(p => p.slot.state === 'Done').length;
  const acts = therapistActions();
  const h = NOW.getHours(), greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const rows = sched.map(p => {
    const m = patientMetrics(p), blocked = m.unitStatus === 'Out of service' && p.slot.state !== 'Done';
    const s = m.sessions.find(x => x.today);
    const result = p.slot.state === 'Done' && s ? `${s.minutes} min <span class="muted">· ${Math.round(s.accuracy)}% accuracy</span>`
      : blocked ? `<button class="btn sm" data-act="requestDevice" data-pid="${p.id}">Request another unit</button>` : '';
    return `<div class="srow ${p.slot.state === 'Done' ? 'done' : ''} ${p.slot.state === 'In progress' && !blocked ? 'now' : ''}" data-href="#/patient/${p.id}">
      <div class="st">${fmtT(p.slot.time)}</div>
      <div class="sp2"><b>${esc(p.name)}</b><span>${typeLabel(p.plan.typeId)} · <span class="mono">${esc(p.plan.unitId)}</span> · ${p.plan.minutes} min planned</span></div>
      <div class="sr">${result}</div><div class="ss">${blocked ? pill('Device out of service', 'crit') : pill(p.slot.state)}</div></div>`;
  }).join('');
  const todo = acts.map(a => { const i = a.title.indexOf(' · '), what = a.title.slice(i + 3); return { ...a, title: a.title.slice(0, i), desc: what.charAt(0).toUpperCase() + what.slice(1) + (a.desc ? ' · ' + a.desc : '') }; });
  return pageHead(`${greet}, ${esc(me().name.split(' ')[0])}`, `${WDL[TODAY.getDay()]}, ${TODAY.getDate()} ${MONL[TODAY.getMonth()]}`)
    + `<div class="grid g-wide">
      ${card('Sessions today', rows || '<div class="empty">No sessions scheduled today.</div>', { flush: true, sub: `${done} of ${sched.length} done` })}
      ${card('To do', list(todo, 'You’re all caught up.'), { flush: true, sub: acts.length ? String(acts.length) : '' })}
    </div>`;
}

   ===================================================================== */
function heatmap(p, m, sess7){
  const weeks = clamp(Math.ceil((daysAgo(p.plan.start) + ((startOfDay(p.plan.start).getDay() + 6) % 7) + 1) / 7), 1, 12);
  const dow = (TODAY.getDay() + 6) % 7, start = addDays(TODAY, -dow - (weeks - 1) * 7);
  let cols = '', lastMonth = -1, lastLab = -9;
  for (let w = 0; w < weeks; w++) {
    const wkStart = addDays(start, w * 7);
    let ml = ''; if (wkStart.getMonth() !== lastMonth && w - lastLab >= 3) { ml = MONTHS[wkStart.getMonth()]; lastLab = w; } lastMonth = wkStart.getMonth();
    let cells = '';
    for (let k = 0; k < 6; k++) {
      const d = addDays(wkStart, k), isToday = dayKey(d) === dayKey(TODAY);
      if (d > TODAY || !p.plan || d < startOfDay(p.plan.start) || (p.discharged && d > p.discharged)) { cells += `<div class="c na ${isToday ? 'today' : ''}"></div>`; continue; }
      const mins = sum(m.sessions.filter(s => dayKey(s.date) === dayKey(d)).map(s => s.minutes)), r = mins / p.plan.minutes;
      const lv = mins === 0 ? 0 : r < 0.5 ? 1 : r < 0.8 ? 2 : r < 1 ? 3 : 4;
      const tip = isToday && !mins ? `<b>Today</b><div class="tr"><span>Session</span><b>${p.slot ? p.slot.state : 'Not scheduled'}</b></div>` : `<b>${WD[d.getDay()]} ${fmtD(d)}</b><div class="tr"><span>Therapy</span><b>${mins} / ${p.plan.minutes} min</b></div>`;
      cells += `<div class="c l${lv} ${isToday ? 'today' : ''}" data-tip="${esc(tip)}"></div>`;
    }
    cols += `<div class="wk"><div class="ml">${ml}</div>${cells}</div>`;
  }
  return `<div class="row" style="align-items:flex-start;gap:32px;flex-wrap:wrap"><div class="heat"><div class="days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>${cols}</div>
    <div class="col" style="gap:12px;min-width:170px">
      <div><div class="xs muted">Last 7 days</div><div style="font-size:18px;font-weight:600">${sess7} of ${p.plan.daysPerWeek} <span class="sm muted" style="font-weight:400">sessions</span></div></div>
      <div><div class="xs muted">Since start</div><div style="font-size:18px;font-weight:600">${m.adhAll != null ? pct(m.adhAll) : '—'} <span class="sm muted" style="font-weight:400">of planned minutes</span></div></div>

function viewPatient(id, tab){

  let body = '';
  if (tab === 'summary') {
    const lastS = m.sessions[m.sessions.length - 1];
    const team = [[userOf(p.therapistId), 'Therapist'], [userOf(p.consultantId), 'Consultant']].concat(p.plan ? [[ownerOfType(p.plan.typeId), 'Device engineer']] : []);
    const sess7 = m.sessions.filter(s => daysAgo(s.date) >= 1 && daysAgo(s.date) <= 7).length;

}

function viewOutcomes(){
  const all = DB.patients.filter(p => p.status !== 'New').map(p => ({ p, m: patientMetrics(p) })).filter(x => x.m.change != null);
  const reached = all.filter(x => x.m.change >= SCALES[x.p.scale].mcid).length;
  const gains = all.map(x => x.m.gainPct).sort((a, b) => a - b), med = gains.length ? gains[Math.floor(gains.length / 2)] : 0;
  const act = DB.patients.filter(p => p.status === 'Active').map(p => ({ p, m: patientMetrics(p) }));
  const adhs = act.map(x => x.m.adh7).filter(v => v != null);
  const byType = DEVICE_TYPES.map(t => { const xs = all.filter(x => x.p.plan && x.p.plan.typeId === t.id); return { t, n: xs.length, gain: mean(xs.map(x => x.m.gainPct)), mcid: xs.filter(x => x.m.change >= SCALES[t.scale].mcid).length, adh: mean(xs.map(x => x.m.adhAll).filter(v => v != null)) }; }).filter(r => r.n);
  const byDx = [['Ischaemic stroke', 'Ischaemic'], ['Haemorrhagic stroke', 'Haemorrhagic'], ['Traumatic brain injury', 'Traumatic']].map(([label, k]) => ({ label, value: round1(mean(all.filter(x => x.p.diagnosis.startsWith(k)).map(x => x.m.gainPct)) || 0) }));
  const traj = scale => { const pts = []; for (let w = 0; w <= 10; w += 2) { const v = []; all.filter(x => x.p.scale === scale).forEach(x => { const a = x.m.assessments[w / 2]; if (a) v.push(a.score / SCALES[scale].max * 100); }); if (v.length >= 2) pts.push({ x: w, y: round1(mean(v)) }); } return pts; };
  const bins = [[0, .4, '<40%'], [.4, .6, '40–60'], [.6, .8, '60–80'], [.8, 1.01, '80–100'], [1.01, 9, '>100%']].map(([a, b, l]) => ({ label: l, full: 'Adherence ' + l + (l.includes('%') ? '' : '%'), value: adhs.filter(v => v >= a && v < b).length }));
  const pts = act.filter(x => x.m.change != null && x.m.adhAll != null).map(x => { const flag = reviewReasons(x.p, x.m).length > 0; return {
    x: Math.round(x.m.adhAll * 100), y: round1(x.m.gainPct), label: x.p.name, href:'#/patient/' + x.p.id, color: flag ? 'var(--series-2)' : 'var(--series-1)',
    tip: `<b>${esc(x.p.name)}</b><div class="tr"><span>Adherence</span><b>${pct(x.m.adhAll)}</b></div><div class="tr"><span>Gain</span><b>${round1(x.m.gainPct)}% of scale</b></div><div class="tr"><span>${x.p.scale}</span><b>${x.m.baseline} → ${x.m.latest.score}</b></div>` }; });
  return pageHead('Outcomes', all.length + ' patients with two or more assessments')
    + stats([
      { l:'Reached MCID', v: `${Math.round(reached / all.length * 100)}%`, f: `${reached} of ${all.length} patients` },
      { l:'Median gain', v: round1(med) + '%', f:'of scale range since baseline' },
      { l:'Mean adherence · 7d', v: adhs.length ? pct(mean(adhs)) : '—', f: act.length + ' active patients' },
      { l:'Discharged', v: DB.patients.filter(p => p.status === 'Discharged').length, f:'completed programme' },
    ])
    + `<div class="grid g2 mb">
      ${card('Recovery trajectory', chart({ type:'line', height: 230, yMin: 0, yMax: 100, fmt: v => Math.round(v) + '%', xFmt: v => 'Week ' + Math.round(v), xName:'Week', series:[{ name:'Upper limb · FMA-UE', color:'var(--series-1)', points: traj('FMA-UE') }, { name:'Balance · BBS', color:'var(--series-2)', points: traj('BBS') }] }), { sub:'mean score, % of scale' })}
      ${card('Adherence vs gain', chart({ type:'scatter', height: 230, points: pts, xName:'Adherence since start (%)', yName:'Gain (% of scale)', xFmt: v => v + '%', yFmt: v => v + '%', xMin: 20, xMax: 100, refX: 60, refXLabel:'60%', legend:`<div class="legend"><span><i style="background:var(--series-2)"></i>Flagged</span><span><i style="background:var(--series-1)"></i>On track</span></div>` }), { sub:'active patients' })}
    </div>
    <div class="grid g-wide">
      ${card('By device', table([
        { h:'Device', v: r => `<div class="pri">${r.t.name}</div><div class="sec2">${esc(r.t.category)}</div>` },
        { h:'Patients', r: 1, v: r => r.n, sort: r => r.n },
        { h:'Mean gain', r: 1, v: r => round1(r.gain) + '%', sort: r => r.gain },
        { h:'Reached MCID', r: 1, v: r => `${r.mcid}/${r.n}`, sort: r => r.mcid / r.n },
        { h:'Adherence', v: r => r.adh != null ? meter(r.adh, adhTone(r.adh)) : '—', sort: r => r.adh || 0 },
      ], byType, { key:'od' }), { flush: true })}
      <div class="stack">${card('Gain by diagnosis', hbars(byDx, { fmt: v => v + '%', name:'Mean gain', labelW:'150px' }), { sub:'% of scale range' })}
        ${card('Adherence distribution', chart({ type:'bar', height: 150, xName:'Adherence', yName:'Patients', data: bins }), { sub:'active patients, 7 days' })}</div>
    </div>`;
}

/* =====================================================================
   14. ENGINEER — FLEET, DEVICE, SERVICE, REQUESTS
   ===================================================================== */
function unitRow(u){
  const ss = unitSessions(u), s7 = inLast(ss, 7);
  return { u, st: liveStatus(u), s7: s7.length, min7: sum(s7.map(s => s.minutes)), err7: mean(s7.map(s => s.trackErr)), cal: daysToCal(u),
    use14: daily(ss, 14, x => sum(x.map(s => s.minutes))).map(r => r.value), faults: DB.faults.filter(f => f.unitId === u.id && OPEN_FAULT(f)) };
}
function devCard(x){
  const f = x.faults.slice().sort((a, b) => sevOrder[a.severity] - sevOrder[b.severity])[0];
  const alert = f ? `<div class="dev-alert ${f.severity === 'Critical' || f.severity === 'High' ? '' : 'warn'}">${icon('alert', 13)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.severity}: ${esc(f.desc)}</span></div>`
    : x.st === 'Offline' ? `<div class="dev-alert">${icon('wifi', 13)}No heartbeat for ${Math.round((NOW - x.u.lastSync) / 3600000)} h</div>`
    : x.cal < 0 ? `<div class="dev-alert warn">${icon('cal', 13)}Calibration overdue ${-x.cal} d</div>` : '';
  return `<div class="dev ${x.st === 'Out of service' ? 'crit' : ''}" data-href="#/device/${x.u.id}">
    <div class="dev-h"><div class="grow"><b>${esc(x.u.id)}</b><span>${typeOf(x.u.typeId).name} · ${esc(x.u.room)}</span></div>${pill(x.st)}</div>
    <div class="dev-m"><div><span>Sessions 7d</span><b>${x.s7}</b></div><div><span>Track err</span><b>${x.err7 != null ? x.err7.toFixed(2) + '°' : '—'}</b></div><div><span>Calibration</span><b>${x.cal < 0 ? `<span class="down">Overdue</span>` : x.cal + ' d'}</b></div></div>
    <div>${spark(x.use14, 240, 26).replace('width="240"', 'width="100%" viewBox="0 0 240 26" preserveAspectRatio="none"')}<div class="row xs muted" style="justify-content:space-between;margin-top:2px"><span>Minutes/day · 14d</span><span>Sync ${syncTxt(x.u)}</span></div></div>
    ${alert}</div>`;
}
function viewFleet(){
  const F = STATE.filters, mode = F.fl || 'all', q = (F.fq || '').toLowerCase();
  const rows = scopeUnits().map(unitRow);
  const bad = x => ['Out of service', 'Offline', 'Needs attention'].includes(x.st);
  const shown = rows.filter(x => (mode === 'all' || (mode === 'att' && bad(x)) || (mode === 'use' && (x.st === 'In use' || x.st === 'In session')) || (mode === 'avail' && x.st === 'Available')) && (!q || (x.u.id + x.u.room + typeOf(x.u.typeId).name).toLowerCase().includes(q)));
  const ids = rows.map(x => x.u.id);
  const tickets = DB.faults.filter(f => OPEN_FAULT(f) && ids.includes(f.unitId)).sort((a, b) => sevOrder[a.severity] - sevOrder[b.severity]);
  const reqs = DB.requests.filter(q2 => q2.status === 'Pending' && (role() === 'admin' || me().owns.includes(q2.typeId)));
  const types = role() === 'engineer' ? me().owns.map(typeLabel).join(', ') : DEVICE_TYPES.length + ' device types';
  return pageHead('Fleet', `${rows.length} units · ${types}`, `<button class="btn" data-act="reportFault">${icon('plus', 15)} New ticket</button>`)
    + stats([
      { l:'In session now', v: rows.filter(x => x.st === 'In session').length, f:'live' },
      { l:'Available', v: rows.filter(x => x.st === 'Available' || x.st === 'In use').length, f:'in service' },
      { l:'Needs attention', v: rows.filter(x => x.st === 'Needs attention' || x.st === 'Offline').length, f:'minor fault, sync or calibration', cls: rows.some(x => x.st === 'Needs attention' || x.st === 'Offline') ? 'warnv' : '' },
      { l:'Out of service', v: rows.filter(x => x.st === 'Out of service').length, f:'critical or high fault', cls: rows.some(x => x.st === 'Out of service') ? 'bad' : '' },
      { l:'Device minutes · 7d', v: sum(rows.map(x => x.min7)).toLocaleString(), f: sum(rows.map(x => x.s7)) + ' sessions' },
    ])
    + `<div class="toolbar">${segs('fl', [['all', 'All', rows.length], ['att', 'Attention', rows.filter(bad).length], ['use', 'In use', rows.filter(x => x.st === 'In use' || x.st === 'In session').length], ['avail', 'Available', rows.filter(x => x.st === 'Available').length]], mode)}<span class="grow"></span>${searchBox('fq', 'Search units')}</div>`
    + `<div class="fleet mb">${shown.map(devCard).join('') || '<div class="empty">No units match.</div>'}</div>`
    + `<div class="grid g2">
      ${card('Open tickets', list(tickets.slice(0, 5).map(f => ({ icon:'wrench', tone: f.severity === 'Critical' || f.severity === 'High' ? 'crit' : 'warn', title: `<span class="mono">${esc(f.unitId)}</span> · ${esc(f.desc)}`, desc: f.severity + ' · ' + f.status + ' · opened ' + rel(f.opened), href:'#/service' })), 'No open tickets.'), { flush: true, right:'<a class="lnk xs" href="#/service">Service board</a>' })}
      ${card('Device requests', list(reqs.map(q2 => ({ icon:'inbox', tone:'accent', title: typeLabel(q2.typeId) + ' for ' + plink(patientOf(q2.patientId)), desc: esc(userOf(q2.requestedBy).name) + ' · ' + rel(q2.date), href:'#/requests', action:`<button class="btn sm" data-act="assignRequest" data-rid="${q2.id}">Assign</button>` })), 'No pending requests.'), { flush: true })}
    </div>`;
}

function unitEvents(u){
  const ev = [], ss = inLast(unitSessions(u), 7);
  const ts = (d, salt) => { const x = new Date(d.getTime() + (salt % 50) * 1000); return MONTHS[x.getMonth()] + ' ' + String(x.getDate()).padStart(2, '0') + ' ' + fmtT(x) + ':' + String(x.getSeconds()).padStart(2, '0'); };
  ss.forEach((s, i) => {
    ev.push({ d: s.date, lv:'INFO', msg:`session.end id=${s.id} dur=${s.minutes}m trials=${s.trials} err=${s.trackErr}°`, salt: i * 7 });
    if (s.flags) ev.push({ d: new Date(s.date.getTime() - 9 * 60000), lv:'WARN', msg:`sensor.out_of_range count=${s.flags} axis=${1 + (i % 3)} session=${s.id}`, salt: i * 3 });
    if (s.disconnects) ev.push({ d: new Date(s.date.getTime() - 14 * 60000), lv:'WARN', msg:`link.drop reconnect_ms=${2400 + i * 37}`, salt: i });
  });
  DB.faults.filter(f => f.unitId === u.id).forEach(f => f.log.forEach((l, i) => { if (daysAgo(l.date) < 30) ev.push({ d: l.date, lv: i === 0 ? (f.severity === 'Critical' || f.severity === 'High' ? 'ERROR' : 'WARN') : 'INFO', msg: i === 0 ? `ticket.open ${f.id} severity=${f.severity.toLowerCase()} "${f.desc}"` : `ticket.update ${f.id} status=${l.text.toLowerCase().replace(/ /g, '_')}`, salt: i }); }));
  if (daysAgo(u.lastCal) < 30) ev.push({ d: new Date(u.lastCal.getTime() + 10 * 3600000), lv:'OK', msg:`calibration.complete offset=0.05° by=${ownerOfType(u.typeId).login}`, salt: 3 });
  if ((NOW - u.lastSync) / 3600000 > 24) ev.push({ d: NOW, lv:'ERROR', msg:`heartbeat.missed last_seen=${ts(u.lastSync, 0)}`, salt: 0 });
  else ev.push({ d: u.lastSync, lv:'INFO', msg:`sync.ok fw=${u.firmware} queue=0`, salt: 11 });
  return ev.sort((a, b) => b.d - a.d).slice(0, 40).map(e => `<div class="e"><span class="ts">${ts(e.d, e.salt)}</span><span class="lv ${e.lv}">${e.lv}</span><span>${esc(e.msg)}</span></div>`).join('');
}
function viewDevice(id, tab){
  const u = unitOf(id);
  if (!u || !canSeeUnit(u)) return notAllowed();
  const t = typeOf(u.typeId), st = liveStatus(u), ss = unitSessions(u), base = '#/device/' + u.id;
  if (!['overview', 'telemetry', 'sessions', 'usage', 'outcomes', 'service'].includes(tab)) tab = 'overview';
  const fl = DB.faults.filter(f => f.unitId === u.id).sort((a, b) => b.opened - a.opened), open = fl.filter(OPEN_FAULT);
  const head = `<div class="banner"><span class="av lg" style="border-radius:12px">${icon('robot', 22)}</span>

      <div class="ids"><span>${t.name} · ${esc(t.category)}</span><span><b>Serial</b> ${esc(u.serial)}</span><span><b>Location</b> ${esc(u.room)}</span><span><b>Firmware</b> ${esc(u.firmware)}</span><span><b>In service since</b> ${fmtDY(u.commissioned)}</span></div></div>

  const d30 = inLast(ss, 30), d7 = inLast(ss, 7);
  let body = '';
  if (tab === 'overview') {
    const cal = []; for (let w = 12; w >= 0; w--) { const d = addDays(TODAY, -w * 7); cal.push({ x: d, y: calOffset(u, d) }); }
    const ev = daily(ss, 21, x => sum(x.map(s => s.flags + s.disconnects))).filter(r => r.d < TODAY);
    body = stats([
        { l:'Open tickets', v: open.length, f: fl.length + ' all-time', cls: open.some(f => f.severity === 'Critical' || f.severity === 'High') ? 'bad' : '' },
        { l:'Calibration due', v: daysToCal(u) < 0 ? 'Overdue' : daysToCal(u) + ' d', f:'Last ' + fmtD(u.lastCal), cls: daysToCal(u) < 0 ? 'warnv' : '' },
        { l:'Offset', v: calOffset(u, TODAY).toFixed(2) + '°', f:'Tolerance ' + CAL_TOL + '°', cls: calOffset(u, TODAY) > CAL_TOL ? 'warnv' : '' },
        { l:'Last sync', v: rel(u.lastSync), f: (NOW - u.lastSync) / 3600000 > 24 ? 'Heartbeat missed' : 'Healthy', cls: (NOW - u.lastSync) / 3600000 > 24 ? 'bad' : '' },
        { l:'Sessions · 7d', v: d7.length, f: sum(d7.map(s => s.minutes)) + ' min' },
      ])
      + `<div class="grid g2 mb">
        ${card('Calibration offset', chart({ type:'line', height: 180, yMin: 0, fmt: v => v.toFixed(1) + '°', series:[{ name:'Offset', color:'var(--series-1)', points: cal }], refs:[{ y: CAL_TOL, label:'Tolerance' }] }), { sub:'weekly check' })}
        ${card('Sensor & link events', chart({ type:'bar', height: 180, yName:'Events', data: ev.map(dayBar) }), { sub:'per day, 20 days' })}
      </div>` + card('Event log', `<div class="log">${unitEvents(u)}</div>`, { flush: true, sub:'last 7 days' });
  } else if (tab === 'telemetry') {
    const dd = daily(ss, 30, x => x).filter(r => r.ss.length && r.d < TODAY);
    const line = (name, fn, fmt, refs) => chart({ type:'line', height: 190, yMin: 0, fmt, refs, series:[{ name, color:'var(--series-1)', points: dd.map(r => ({ x: r.d, y: round1(fn(r.ss)) })) }] });
    body = stats([
        { l:'Tracking error · 7d', v: d7.length ? mean(d7.map(s => s.trackErr)).toFixed(2) + '°' : '—', f:'30d mean ' + (d30.length ? mean(d30.map(s => s.trackErr)).toFixed(2) + '°' : '—'), cls: d7.length && mean(d7.map(s => s.trackErr)) > 2.2 ? 'warnv' : '' },
        { l:'Command latency · 7d', v: d7.length ? Math.round(mean(d7.map(s => s.latency))) + ' ms' : '—', f:'Spec ≤ 40 ms' },
        { l:'Peak output · 7d', v: d7.length ? Math.round(Math.max(...d7.map(s => s.peakOut)) / t.outLimit * 100) + '%' : '—', f:'of ' + t.outLimit + ' ' + t.outUnit + ' limit' },
        { l:'Sessions measured', v: d30.length, f:'30 days' },
      ])
      + `<div class="grid g3">
        ${card('Tracking error', line('Tracking error', x => mean(x.map(s => s.trackErr)), v => v.toFixed(1) + '°', [{ y: 2.5, label:'Spec 2.5°' }]), { sub:'daily mean' })}
        ${card('Command latency', line('Latency', x => mean(x.map(s => s.latency)), v => Math.round(v) + ' ms', [{ y: 40, label:'Spec 40 ms' }]), { sub:'daily mean' })}
        ${card('Peak output', line('Peak output', x => Math.max(...x.map(s => s.peakOut)) / t.outLimit * 100, v => Math.round(v) + '%', [{ y: 90, label:'90% of limit' }]), { sub:'daily max, % of limit' })}
      </div>`;
  } else if (tab === 'sessions') {
    body = card('Sessions', table([
      { h:'Time', v: s => `<span class="nowrap">${fmtD(s.date)} ${fmtT(s.date)}</span>`, sort: s => +s.date },
      { h:'Patient', v: s => `<span class="mono">${esc(pname(patientOf(s.patientId)))}</span>` },
      { h:'Game', v: s => esc(GAME_LABELS[s.game]) }, { h:'Movement', v: s => `<span class="soft">${esc(s.mechanism)}</span>` },
      { h:'Min', r: 1, v: s => s.minutes }, { h:'Trials', r: 1, v: s => s.trials }, { h:'Acc.', r: 1, v: s => s.accuracy + '%' },
      { h:'Track err', r: 1, v: s => s.trackErr.toFixed(2) + '°', sort: s => s.trackErr }, { h:'Latency', r: 1, v: s => s.latency + ' ms', sort: s => s.latency },
      { h:'Peak', r: 1, v: s => Math.round(s.peakOut / t.outLimit * 100) + '%' }, { h:'Flags', r: 1, v: s => s.flags ? `<span style="color:var(--warn-ink);font-weight:600">${s.flags}</span>` : '<span class="muted">0</span>', sort: s => s.flags },
    ], ss.slice().reverse(), { key:'ds', limit: 30, foot:'sessions' }), { flush: true, right: anon() ? tag(icon('lock', 11) + ' De-identified') : '' });
  } else if (tab === 'usage') {
    const mins = daily(ss, 30, x => sum(x.map(s => s.minutes))).filter(r => r.d < TODAY);
    const by = (key, lab) => Object.entries(d30.reduce((a, s) => (a[s[key]] = (a[s[key]] || 0) + s.minutes, a), {})).map(([k, v]) => ({ label: lab ? lab(k) : k, value: v })).sort((a, b) => b.value - a.value);
    body = stats([
        { l:'Sessions · 30d', v: d30.length, f: d7.length + ' in last 7 days' },
        { l:'Device minutes · 30d', v: sum(d30.map(s => s.minutes)).toLocaleString(), f:'' },
        { l:'Patients · 30d', v: new Set(d30.map(s => s.patientId)).size, f:'' },
        { l:'Mean session', v: d30.length ? Math.round(mean(d30.map(s => s.minutes))) + ' min' : '—', f:'' },
      ])
      + `<div class="grid g-wide">${card('Device minutes per day', chart({ type:'bar', height: 230, yName:'Minutes', data: mins.map(dayBar) }), { sub:'30 days' })}

  } else if (tab === 'outcomes') {
    const pids = [...new Set(ss.map(s => s.patientId))];
    const rows = pids.map(pid => { const p = patientOf(pid), m = patientMetrics(p), mine = ss.filter(s => s.patientId === pid), f5 = mine.slice(0, 5), l5 = mine.slice(-5);
      return { p, m, n: mine.length, acc0: mean(f5.map(s => s.accuracy)), acc1: mean(l5.map(s => s.accuracy)), rom0: mean(f5.map(s => s.rom)), rom1: mean(l5.map(s => s.rom)) }; });
    const acc = daily(ss, 30, x => mean(x.map(s => s.accuracy))).filter(r => r.value != null && r.d < TODAY);
    body = `<div class="grid g-wide">${card('Patients on this unit', table([
        { h:'Patient', v: x => canSeePatient(x.p) ? plink(x.p) : `<span class="mono pri">${esc(pname(x.p))}</span>`, sort: x => x.p.code },
        { h:'Sessions', r: 1, v: x => x.n, sort: x => x.n },
        { h:'Accuracy', r: 1, v: x => `${Math.round(x.acc0)} → ${Math.round(x.acc1)}% ${delta(Math.round(x.acc1 - x.acc0))}`, sort: x => x.acc1 - x.acc0 },
        { h:'ROM', r: 1, v: x => `${Math.round(x.rom0)} → ${Math.round(x.rom1)}° ${delta(Math.round(x.rom1 - x.rom0))}`, sort: x => x.rom1 - x.rom0 },
        { h:'Clinical score', r: 1, v: x => x.m.change != null ? `${x.m.baseline} → ${x.m.latest.score} ${delta(x.m.change)}` : '—', sort: x => x.m.gainPct || 0 },
      ], rows, { key:'dout', empty:'No patients yet.' }), { flush: true, sub:'first vs last 5 sessions', right: anon() ? tag(icon('lock', 11) + ' De-identified') : '' })}
      ${card('Mean game accuracy', chart({ type:'line', height: 220, yMin: 0, yMax: 100, fmt: v => Math.round(v) + '%', series:[{ name:'Accuracy', color:'var(--series-1)', points: acc.map(r => ({ x: r.d, y: round1(r.value) })) }] }), { sub:'all patients, 30 days' })}</div>`;
  } else if (tab === 'service') {
    const cals = [0, 1, 2, 3].map(k => addDays(u.lastCal, -k * u.calInterval)).filter(d => d > u.commissioned);
    body = `<div class="grid g-wide">${card('Tickets', table([
        { h:'Ticket', v: f => `<span class="mono muted">${esc(f.id)}</span>` }, { h:'Severity', v: f => sev(f.severity) }, { h:'Summary', v: f => esc(f.desc) },
        { h:'Opened', v: f => `<span class="nowrap soft">${fmtD(f.opened)}</span>` }, { h:'Status', v: f => pill(f.status) }, { h:'', r: 1, v: f => faultBtn(f) },
      ], fl, { empty:'No tickets for this unit.' }), { flush: true })}
      ${card('Calibration record', `<ul class="tl">${cals.map(d => `<li><div>Calibrated · offset 0.05°</div><div class="when">${fmtDY(d)} · ${esc(ownerOfType(u.typeId).name)}</div></li>`).join('')}</ul>`, { flush: true, sub:'every ' + u.calInterval + ' days' })}</div>`;
  }
  return head + tabs(base, [['overview', 'Overview'], ['telemetry', 'Telemetry'], ['sessions', 'Sessions', ss.length], ['usage', 'Usage'], ['outcomes', 'Outcomes'], ['service', 'Service', open.length || '']], tab) + body;
}

function faultBtn(f){
  const i = FAULT_STEPS.indexOf(f.status);
  if (i >= FAULT_STEPS.length - 1) return '';
  return `<button class="btn sm ${i === 2 ? 'pri' : ''}" data-act="advanceFault" data-fid="${f.id}">${['Start investigation', 'Mark resolved', 'Clear for use'][i]}</button>`;
}

  const items = [];
  openF.filter(f => f.severity === 'Critical' || f.severity === 'High').forEach(f => items.push({ icon:'wrench', tone:'crit', title: f.severity + ' · <span class="mono">' + esc(f.unitId) + '</span> · ' + esc(f.desc), desc: f.status + ' · ' + esc(ownerOfType(unitOf(f.unitId).typeId).name), right: rel(f.opened), href:'#/service' }));

/* =====================================================================
   16. NOTIFICATIONS (derived from live data)
   ===================================================================== */
function notifications(){
  const r = role(), out = [];
  const add = (id, tone, title, desc, date, href) => out.push({ id, tone, title, desc, date, href });
  if (r === 'therapist') therapistActions().forEach(a => add(a.key, a.tone, a.title, a.desc, a.date || addDays(NOW, -0.1), a.href));
  if (r === 'consultant' || r === 'admin') DB.patients.filter(p => p.status === 'Active').forEach(p => { const m = patientMetrics(p); if (m.declining) add('dec' + p.id, 'crit', esc(p.name) + ' · score down ' + ptsTxt(m.lastDelta), SCALES[p.scale].name, m.latest.date, '#/patient/' + p.id); });
  if (r === 'consultant') DB.patients.filter(p => p.plan).forEach(p => p.plan.history.slice(1).filter(h => daysAgo(h.date) <= 7).forEach((h, i) => add('pc' + p.id + i, 'accent', 'Plan changed · ' + esc(p.name), esc(h.text), h.date, '#/patient/' + p.id + '/plan')));
  if (r === 'engineer' || r === 'admin') {
    const ids = scopeUnits().map(u => u.id);
    DB.faults.filter(f => OPEN_FAULT(f) && ids.includes(f.unitId)).forEach(f => add(f.id + f.status, f.severity === 'Critical' || f.severity === 'High' ? 'crit' : 'warn', f.severity + ' ticket · ' + esc(f.unitId), esc(f.desc), f.opened, '#/service'));
    DB.requests.filter(q => q.status === 'Pending' && (r === 'admin' || me().owns.includes(q.typeId))).forEach(q => add(q.id, 'accent', 'Device request · ' + typeLabel(q.typeId), esc(userOf(q.requestedBy).name), q.date, '#/requests'));
    DB.units.filter(u => ids.includes(u.id) && daysToCal(u) <= 7).forEach(u => add('cal' + u.id, 'warn', 'Calibration ' + (daysToCal(u) < 0 ? 'overdue' : 'due') + ' · ' + u.id, daysToCal(u) < 0 ? -daysToCal(u) + ' days overdue' : 'Due in ' + daysToCal(u) + ' days', addDays(u.lastCal, u.calInterval - 7), '#/device/' + u.id));
  }
  return out.sort((a, b) => b.date - a.date);
}

function doLogin(form){

  const u = USERS.find(x => (x.login === id || x.email === id) && x.status === 'Active');
  if (!u || pw !== DEMO_PASSWORD) {

/* =====================================================================
   19. SEARCH PALETTE (Ctrl+K)
   ===================================================================== */
function openSearch(){
  if (!STATE.user || document.querySelector('.cmdk-scrim')) return;
  const wrap = document.createElement('div'); wrap.className = 'cmdk-scrim';
  wrap.innerHTML = `<div class="cmdk"><input placeholder="Search patients, devices, pages…"><div class="cmdk-list"></div></div>`;
  document.body.appendChild(wrap);
  const inp = wrap.querySelector('input'), listEl = wrap.querySelector('.cmdk-list');
  let items = [], sel = 0;
  const pages = NAV[role()].filter(Array.isArray).map(n => ({ g:'Pages', ic: n[2], t: n[1], s: '', href: '#/' + n[0] }));
  const pats = role() === 'engineer' ? [] : scopePatients().map(p => ({ g:'Patients', ic:'user', t: p.name, s: 'MRN ' + p.mrn + ' · ' + p.status, href: '#/patient/' + p.id, k: p.name + p.mrn + p.diagnosis }));
  const devs = (role() === 'engineer' || role() === 'admin') ? scopeUnits().map(u => ({ g:'Devices', ic:'robot', t: u.id, s: typeOf(u.typeId).name + ' · ' + liveStatus(u), href: '#/device/' + u.id, k: u.id + u.room + typeOf(u.typeId).name })) : [];
  const draw = () => {
    const q = inp.value.toLowerCase().trim();
    items = [...pages, ...pats, ...devs].filter(x => !q || (x.k || x.t).toLowerCase().includes(q)).slice(0, 12);
    sel = Math.min(sel, Math.max(0, items.length - 1));
    let g = '';
    listEl.innerHTML = items.length ? items.map((x, i) => (x.g !== g ? `<div class="cmdk-g">${(g = x.g)}</div>` : '') + `<div class="cmdk-i ${i === sel ? 'sel' : ''}" data-i="${i}">${icon(x.ic, 15)}<span>${esc(x.t)}</span><span class="sub">${esc(x.s)}</span></div>`).join('') : '<div class="empty">No results</div>';
  };
  const close = () => wrap.remove();
  const pickIt = i => { if (items[i]) { close(); go(items[i].href); } };
  inp.addEventListener('input', () => { sel = 0; draw(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') pickIt(sel);
    else if (e.key === 'Escape') close();
  });
  wrap.addEventListener('click', e => { const it = e.target.closest('.cmdk-i'); if (it) pickIt(+it.dataset.i); else if (e.target === wrap) close(); });
  draw(); inp.focus();
}

function render(){
  CHARTS = {};
  const app = document.getElementById('app'), focus = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.filter : null;
  if (!STATE.user) { document.body.removeAttribute('data-role'); document.body.dataset.density = 'medium'; app.innerHTML = viewLogin(); const f = document.getElementById('login'); f.addEventListener('submit', e => { e.preventDefault(); doLogin(f); }); document.getElementById('uid').focus(); return; }
  const r = role(), rt = parseHash();
  if (!rt.page) { location.replace('#/' + HOME[r]); return; }
  document.body.dataset.role = r; document.body.dataset.density = DENSITY[r];

  const titleOf = p => { const n = NAV[r].find(x => Array.isArray(x) && x[0] === p); return n ? n[1] : p; };
  const V = { today: viewToday, patients: viewPatientList, review: viewPatientList, equipment: viewEquipment, outcomes: viewOutcomes, fleet: viewFleet, service: viewService, requests: viewRequests, overview: viewOverview, members: viewMembers, audit: viewAudit };
  let content, back = '';
  const backTo = (href, label) => `<a class="back" href="${href}">${icon('chev', 13).replace('M9 6l6 6-6 6', 'M15 6l-6 6 6 6')}${label}</a>`;
  if (!allowed(rt.page)) content = notAllowed();
  else if (rt.page === 'patient') { const lp = r === 'therapist' ? 'patients' : 'review'; content = viewPatient(rt.id, rt.tab); back = backTo('#/' + lp, titleOf(lp)); }
  else if (rt.page === 'device') { content = viewDevice(rt.id, rt.tab); back = backTo('#/fleet', 'Fleet'); }
  else content = V[rt.page] ? V[rt.page]() : notAllowed();

  const mineU = scopeUnits().map(u => u.id);
  const counts = {
    today: r === 'therapist' ? therapistActions().filter(a => a.tone === 'crit' || a.tone === 'warn').length : 0,
    review: r === 'consultant' ? DB.patients.filter(p => p.status === 'Active' && reviewReasons(p, patientMetrics(p)).length).length : 0,
    service: (r === 'engineer' || r === 'admin') ? DB.faults.filter(f => OPEN_FAULT(f) && mineU.includes(f.unitId)).length : 0,
    requests: DB.requests.filter(q => q.status === 'Pending' && (r === 'admin' || (me().owns || []).includes(q.typeId))).length,
  };
  const cur = rt.page === 'patient' ? (r === 'therapist' ? 'patients' : 'review') : rt.page === 'device' ? 'fleet' : rt.page;
  const nav = NAV[r].map(n => typeof n === 'string' ? `<div class="sec">${n.slice(1)}</div>` : `<a href="#/${n[0]}" class="${n[0] === cur ? 'on' : ''}">${icon(n[2])}<span>${n[1]}</span>${counts[n[0]] && (r !== 'admin' || n[0] !== 'requests') ? `<span class="cnt ${n[0] === 'today' || n[0] === 'service' ? '' : ''}">${counts[n[0]]}</span>` : ''}</a>`).join('');
  const notes = notifications(), unread = notes.filter(n => !STATE.read.has(n.id)).length;
  const dark = document.documentElement.dataset.theme === 'dark';
  const openT = DB.faults.filter(f => OPEN_FAULT(f) && mineU.includes(f.unitId) && (f.severity === 'Critical' || f.severity === 'High')).length;

  app.innerHTML = `<div class="shell">
    <aside class="side">
      <div class="ws"><span class="logo">${icon('pulse', 16)}</span><div class="grow" style="min-width:0"><b>NeuroDash</b><span class="nowrap" style="display:block;overflow:hidden;text-overflow:ellipsis">Neuro Rehab Unit</span></div><button class="icon-btn" title="Notifications" data-act="pop" data-pop="notif">${icon('bell', 17)}${unread ? '<span class="dot"></span>' : ''}</button></div>
      <button class="searchbtn" data-act="search">${icon('search', 14)}Search<span class="kbd">Ctrl K</span></button>
      <nav class="nav">${nav}</nav>
      <button class="userbtn" data-act="pop" data-pop="user"><span class="av">${me().initials}</span><div style="min-width:0;flex:1"><b>${esc(me().name)}</b><span>${ROLE_LABEL[r]}</span></div>${icon('chevd', 14)}</button>
    </aside>
    <div class="main"><main class="content">${back}${content}</main></div></div>` + popover(notes);
  mountCharts();
  if (focus) { const el = document.querySelector(`[data-filter="${focus}"]`); if (el) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
}

function popover(notes){
  if (!STATE.pop || !STATE.popAnchor) return '';
  const a = STATE.popAnchor;
  if (STATE.pop === 'user') {
    const dark = document.documentElement.dataset.theme === 'dark';
    return `<div class="pop menu" style="left:${a.left}px;bottom:${innerHeight - a.top + 6}px;width:${Math.max(230, a.width)}px">
      <div class="mh"><b>${esc(me().name)}</b><span>${esc(me().email)}</span></div>
      <div class="mi" style="cursor:default">${icon(dark ? 'moon' : 'sun', 15)}<span class="grow">Theme</span><div class="segs" style="padding:2px"><button data-act="theme" data-val="light" class="${dark ? '' : 'on'}" style="padding:2px 8px;font-size:12px">Light</button><button data-act="theme" data-val="dark" class="${dark ? 'on' : ''}" style="padding:2px 8px;font-size:12px">Dark</button></div></div>
      <button class="mi" data-act="search">${icon('search', 15)}Search<span class="kbd">Ctrl K</span></button>
      <hr><button class="mi" data-act="signOut">${icon('logout', 15)}Sign out</button></div>`;
  }
  if (STATE.pop === 'more') {
    const d = STATE.popData || {};
    return `<div class="pop menu" style="right:${innerWidth - a.right}px;top:${a.bottom + 6}px;width:220px">
      <button class="mi" data-act="requestDevice" data-pid="${d.pid}">${icon('robot', 15)}Request device</button>
      <button class="mi" data-act="reportFault" data-unit="${d.unit || ''}">${icon('alert', 15)}Report device issue</button></div>`;
  }
  const unread = notes.filter(n => !STATE.read.has(n.id)).length;
  return `<div class="pop notif" style="left:${Math.min(a.left, innerWidth - 400)}px;top:${a.bottom + 6}px">
    <div class="notif-h"><b>Notifications</b>${unread ? `<span class="xs muted">${unread} unread</span><button class="btn sm ghost" data-act="readAll">Mark all read</button>` : ''}</div>
    <div class="notif-b">${notes.length ? notes.map(n => `<div class="ni ${STATE.read.has(n.id) ? '' : 'unread'}" data-href="${n.href}" data-nid="${esc(n.id)}"><div class="li" style="padding:0;border:0"><div class="ico ${n.tone}">${icon(n.tone === 'crit' ? 'alert' : n.tone === 'good' ? 'check' : n.tone === 'warn' ? 'clock' : 'bell', 14)}</div></div><div class="grow"><div class="t">${n.title}</div><div class="d">${n.desc}</div><div class="w">${rel(n.date)}</div></div></div>`).join('') : '<div class="empty">You’re all caught up.</div>'}</div></div>`;
}

/* =====================================================================
   21. EVENTS
   ===================================================================== */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); const f = ACTIONS[a.dataset.act]; if (f) { if (a.closest('.pop') && !['theme', 'readAll'].includes(a.dataset.act)) STATE.pop = null; f(a); } return; }
  if (STATE.pop && !e.target.closest('.pop')) { STATE.pop = null; const h0 = e.target.closest('[data-href]'); if (!h0 && !e.target.closest('a[href]')) { render(); return; } }
  const tv = e.target.closest('[data-tv]'); if (tv) { const t = document.getElementById(tv.dataset.tv + '-tv'); t.classList.toggle('hidden'); tv.textContent = t.classList.contains('hidden') ? 'Table' : 'Hide table'; return; }
  const so = e.target.closest('[data-sort]'); if (so) { const [k, c] = so.dataset.sort.split(':'); const cur = STATE.sort[k]; STATE.sort[k] = { col: +c, dir: cur && cur.col === +c ? -cur.dir : 1 }; render(); return; }
  const sf = e.target.closest('[data-setf]'); if (sf) { STATE.filters[sf.dataset.setf] = sf.dataset.val; render(); return; }
  if (e.target.closest('a[href], button, input, select, textarea, label')) return;
  const h = e.target.closest('[data-href]');
  if (h && h.dataset.href) { if (h.dataset.nid) { STATE.read.add(h.dataset.nid); STATE.pop = null; } go(h.dataset.href); }
});
let _ft;
document.addEventListener('input', e => { const f = e.target.dataset && e.target.dataset.filter; if (f) { STATE.filters[f] = e.target.value; clearTimeout(_ft); _ft = setTimeout(render, e.target.tagName === 'INPUT' ? 180 : 0); } });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === 'Escape' && STATE.pop) { STATE.pop = null; render(); }
});
window.addEventListener('hashchange', () => { STATE.pop = null; render(); window.scrollTo(0, 0); });
let _rt; window.addEventListener('resize', () => { clearTimeout(_rt); _rt = setTimeout(() => { if (STATE.pop) { STATE.pop = null; render(); } else mountCharts(); }, 120); });

const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.style.opacity = 0; return; }
  tip.innerHTML = el.getAttribute('data-tip'); tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

(function boot(){
  const th = store.get('theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  const u = store.get('user'); if (u && userOf(u)) STATE.user = userOf(u);
  render();
})();
</script>
</body>
