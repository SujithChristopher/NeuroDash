<title>NeuroDash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NEURODASH — design tokens
   ============================================================ */
:root{
  color-scheme: light;
  --bg: #f4f7f7;
  --bg-plane: #eef3f3;
  --surface: #ffffff;
  --surface-2: #eef3f3;
  --surface-3: #e4ecec;
  --border: #dbe4e4;
  --border-strong: #c3d0d0;
  --ink-900: #0e1b20;
  --ink-700: #435256;
  --ink-500: #6d7c80;
  --ink-400: #8a9698;
  --accent: #0c7b83;
  --accent-600: #086268;
  --accent-ink: #ffffff;
  --accent-soft: #e1f1f1;
  --accent-soft-ink: #086268;
  --focus-ring: #0c7b83;

  --good: #0ca30c;
  --good-soft: #e3f6e3;
  --warning: #b5780a;
  --warning-soft: #fdf0da;
  --serious: #c1592f;
  --serious-soft: #fbe6dc;
  --critical: #c23b3b;
  --critical-soft: #fbe2e2;
  --info: #2a5f8f;
  --info-soft: #e2edf6;

  --series-1: #2a78d6;
  --series-2: #c25a20;
  --series-3: #128f63;
  --series-4: #b3790a;
  --series-5: #c15a89;
  --series-6: #4a3aa7;

  --shadow-sm: 0 1px 2px rgba(14,27,32,0.06);
  --shadow-md: 0 6px 20px rgba(14,27,32,0.10);
  --shadow-lg: 0 16px 40px rgba(14,27,32,0.16);
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 16px;

  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}
/* NeuroDash is deliberately light-only: a research-hospital clinical identity
   that stays consistent regardless of the viewer's OS theme setting. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink-900);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; }
[hidden]{ display:none !important; }
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance; color:var(--ink-900); }
p{ margin:0; }
a{ color:inherit; }
button{ font-family:inherit; }
::selection{ background:var(--accent-soft); }
:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:4px; }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.tabular{ font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-500); }
.muted{ color:var(--ink-500); }
.subtle{ color:var(--ink-700); }
.hidden-scroll::-webkit-scrollbar{ width:8px; height:8px; }
.hidden-scroll::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }

/* ---------- Login ---------- */
.login-wrap{
  min-height:100%;
  display:grid;
  grid-template-columns: 1.1fr 1fr;
  background:var(--bg-plane);
}
@media (max-width:860px){ .login-wrap{ grid-template-columns:1fr; } .login-visual{ display:none; } }
.login-visual{
  position:relative;
  background:
    radial-gradient(1100px 700px at 12% 8%, rgba(12,123,131,0.10), transparent 60%),
    linear-gradient(165deg,#eef6f6 0%, #e3f1f1 45%, #d9edec 100%);
  color:var(--ink-900);
  padding:56px;
  display:flex; flex-direction:column; justify-content:space-between;
  overflow:hidden;
  border-right:1px solid var(--border);
}
.login-visual .brand{ display:flex; align-items:center; gap:12px; }
.login-visual svg{ display:block; }
.login-visual .brand-name{ font-family:var(--font-display); font-size:22px; font-weight:600; letter-spacing:.01em; color:var(--ink-900); }
.login-visual .brand-org{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-600); margin-top:2px; }
.login-visual .pitch h1{ color:var(--ink-900); font-size:34px; line-height:1.18; max-width:520px; }
.login-visual .pitch p{ color:var(--ink-700); margin-top:14px; max-width:460px; font-size:15px; }
.flow-strip{ display:flex; align-items:center; gap:0; margin-top:34px; flex-wrap:wrap; font-family:var(--font-mono); font-size:11.5px; color:var(--accent-600); }
.flow-strip span.node{ padding:6px 10px; border:1px solid var(--border-strong); border-radius:999px; background:var(--surface); }
.flow-strip span.arrow{ padding:0 6px; color:var(--ink-400); }
.login-visual .stat-row{ display:flex; gap:28px; }
.login-visual .stat-row .k{ font-family:var(--font-display); font-size:26px; color:var(--ink-900); }
.login-visual .stat-row .l{ font-size:11px; color:var(--ink-500); text-transform:uppercase; letter-spacing:.07em; margin-top:2px; }
.login-visual .foot{ font-size:12px; color:var(--ink-500); }

.login-panel{ display:flex; align-items:center; justify-content:center; padding:32px; }
.login-card{ width:100%; max-width:400px; }
.login-card .lc-head{ margin-bottom:26px; }
.login-card .lc-head .eyebrow{ margin-bottom:8px; }
.login-card h2{ font-size:24px; }
.login-card .lc-sub{ color:var(--ink-500); margin-top:6px; font-size:13px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-700); margin-bottom:6px; }
.field-hint{ font-size:11.5px; color:var(--ink-500); margin-top:5px; }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], input[type=time], select, textarea{
  width:100%; padding:10px 12px; border-radius:var(--radius-s); border:1px solid var(--border-strong);
  background:var(--surface); color:var(--ink-900); font-size:13.5px; font-family:inherit;
}
textarea{ resize:vertical; min-height:76px; }
input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:1px; }
.row-check{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; font-size:13px; }
.row-check label{ display:flex; align-items:center; gap:8px; color:var(--ink-700); cursor:pointer; }
.link-btn{ background:none; border:none; color:var(--accent); cursor:pointer; font-size:13px; font-weight:600; padding:0; }
.link-btn:hover{ text-decoration:underline; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:var(--radius-s); border:1px solid transparent;
  font-weight:600; font-size:13.5px; padding:10px 16px; cursor:pointer; transition:background .12s,border-color .12s,transform .05s; white-space:nowrap; }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ background:var(--accent-600); }
.btn-secondary{ background:var(--surface); color:var(--ink-900); border-color:var(--border-strong); }
.btn-secondary:hover{ background:var(--surface-2); }
.btn-ghost{ background:transparent; color:var(--ink-700); border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ background:var(--critical); color:#fff; }
.btn-danger:hover{ filter:brightness(1.08); }
.btn-block{ width:100%; }
.btn-sm{ padding:6px 11px; font-size:12.5px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }

.demo-accounts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:22px; }
.demo-acct{ text-align:left; border:1px solid var(--border-strong); background:var(--surface); border-radius:var(--radius-s);
  padding:9px 10px; cursor:pointer; }
.demo-acct:hover{ border-color:var(--accent); background:var(--accent-soft); }
.demo-acct.active{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent); }
.demo-acct .da-role{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-soft-ink); }
.demo-acct .da-name{ font-size:12.5px; font-weight:600; margin-top:2px; }
.login-alert{ display:flex; gap:8px; align-items:flex-start; background:var(--info-soft); border:1px solid var(--info); color:var(--ink-900);
  border-radius:var(--radius-s); padding:10px 12px; font-size:12.5px; margin-top:18px; }

/* ---------- App shell ---------- */
#app-root{ height:100%; }
.shell{ display:grid; grid-template-columns:248px 1fr; height:100%; min-height:100vh; }
.shell.collapsed{ grid-template-columns:72px 1fr; }
.sidebar{ background:var(--surface); color:var(--ink-700); display:flex; flex-direction:column; height:100%; position:sticky; top:0; border-right:1px solid var(--border); }
.sidebar .side-brand{ display:flex; align-items:center; gap:10px; padding:18px 18px; border-bottom:1px solid var(--border); }
.sidebar .side-brand .txt{ overflow:hidden; }
.sidebar .side-brand .brand-name{ font-family:var(--font-display); font-size:16.5px; font-weight:600; color:var(--ink-900); white-space:nowrap; }
.sidebar .side-brand .brand-org{ font-size:9.5px; color:var(--ink-500); text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
.shell.collapsed .side-brand .txt{ display:none; }
.side-nav{ flex:1; overflow-y:auto; padding:14px 10px; }
.side-section-label{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-400); padding:12px 10px 6px; }
.shell.collapsed .side-section-label{ display:none; }
.side-link{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:8px; color:var(--ink-700); text-decoration:none; font-size:13px; font-weight:500; margin-bottom:2px; cursor:pointer; border:none; background:none; width:100%; text-align:left; }
.side-link svg{ flex-shrink:0; width:17px; height:17px; }
.side-link:hover{ background:var(--surface-2); color:var(--ink-900); }
.side-link.active{ background:var(--accent-soft); color:var(--accent-600); font-weight:600; }
.side-link.active svg{ color:var(--accent); }
.shell.collapsed .side-link span.lbl{ display:none; }
.side-link .badge-pill{ margin-left:auto; }
.shell.collapsed .side-link .badge-pill{ display:none; }
.sidebar-foot{ padding:12px; border-top:1px solid var(--border); }
.role-chip{ display:flex; align-items:center; gap:9px; padding:8px; border-radius:8px; }
.role-chip .av{ width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; }
.role-chip .who{ overflow:hidden; }
.role-chip .who .n{ font-size:12.5px; font-weight:600; color:var(--ink-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.role-chip .who .r{ font-size:10.5px; color:var(--ink-500); text-transform:capitalize; }
.shell.collapsed .role-chip .who{ display:none; }
.collapse-btn{ background:none; border:none; color:var(--ink-500); cursor:pointer; padding:6px; border-radius:6px; display:flex; }
.collapse-btn:hover{ background:var(--surface-2); color:var(--ink-900); }

.topbar{ height:58px; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; gap:14px; padding:0 20px; position:sticky; top:0; z-index:30; }
.crumb{ font-size:12.5px; color:var(--ink-500); display:flex; align-items:center; gap:6px; }
.crumb b{ color:var(--ink-900); font-weight:600; }
.search-trigger{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 12px; color:var(--ink-500); font-size:12.5px; cursor:pointer; width:280px; margin-left:12px; }
.search-trigger kbd{ margin-left:auto; font-family:var(--font-mono); font-size:10px; background:var(--surface); border:1px solid var(--border-strong); border-radius:4px; padding:1px 5px; }
.top-actions{ margin-left:auto; display:flex; align-items:center; gap:6px; }
.icon-btn{ position:relative; width:36px; height:36px; border-radius:8px; border:1px solid transparent; background:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-700); }
.icon-btn:hover{ background:var(--surface-2); border-color:var(--border); }
.icon-btn .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--critical); border:2px solid var(--surface); }
.topbar .user-btn{ display:flex; align-items:center; gap:8px; background:none; border:1px solid transparent; padding:5px 8px 5px 5px; border-radius:999px; cursor:pointer; }
.topbar .user-btn:hover{ background:var(--surface-2); border-color:var(--border); }
.topbar .av-sm{ width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent-soft-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; }

.content{ padding:26px 30px 60px; max-width:1400px; }
.page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
.page-head h1{ font-size:25px; }
.page-head .sub{ color:var(--ink-500); margin-top:5px; font-size:13px; max-width:640px; }
.page-actions{ display:flex; gap:8px; flex-wrap:wrap; }

.readonly-banner{ display:flex; gap:10px; align-items:center; background:var(--info-soft); border:1px solid var(--info); color:var(--ink-900); padding:10px 14px; border-radius:var(--radius-s); font-size:12.5px; margin-bottom:20px; }
.readonly-banner b{ font-family:var(--font-mono); letter-spacing:.04em; }

/* ---------- Cards / KPI ---------- */
.grid{ display:grid; gap:16px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:1fr 1fr; }
@media (max-width:1080px){ .grid-4{ grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-4,.grid-3,.grid-2{ grid-template-columns:1fr; } }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow-sm); }
.card-pad{ padding:18px 20px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 0; gap:12px; }
.card-head h3{ font-size:14.5px; font-family:var(--font-body); font-weight:700; }
.card-head .hint{ font-size:11.5px; color:var(--ink-500); }
.card-body{ padding:14px 20px 20px; }

.kpi{ padding:16px 18px; display:flex; flex-direction:column; gap:6px; }
.kpi .k-top{ display:flex; align-items:center; justify-content:space-between; }
.kpi .k-label{ font-size:11.5px; color:var(--ink-500); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.kpi .k-icon{ width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; }
.kpi .k-icon svg{ width:14px; height:14px; }
.kpi .k-val{ font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1; }
.kpi .k-delta{ font-size:11.5px; display:flex; align-items:center; gap:4px; font-weight:600; }
.kpi .k-delta.up{ color:var(--good); }
.kpi .k-delta.down{ color:var(--critical); }
.kpi .k-delta.flat{ color:var(--ink-500); }
.kpi .k-sub{ font-size:11.5px; color:var(--ink-500); }

/* ---------- Badges / status ---------- */
.badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.badge .dot{ width:6px; height:6px; border-radius:50%; }
.badge-good{ background:var(--good-soft); color:var(--good); }
.badge-good .dot{ background:var(--good); }
.badge-warning{ background:var(--warning-soft); color:var(--warning); }
.badge-warning .dot{ background:var(--warning); }
.badge-serious{ background:var(--serious-soft); color:var(--serious); }
.badge-serious .dot{ background:var(--serious); }
.badge-critical{ background:var(--critical-soft); color:var(--critical); }
.badge-critical .dot{ background:var(--critical); }
.badge-info{ background:var(--info-soft); color:var(--info); }
.badge-info .dot{ background:var(--info); }
.badge-neutral{ background:var(--surface-3); color:var(--ink-700); }
.badge-neutral .dot{ background:var(--ink-400); }
.badge-accent{ background:var(--accent-soft); color:var(--accent-soft-ink); }
.badge-accent .dot{ background:var(--accent); }
.pill{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:600; background:var(--surface-3); color:var(--ink-700); }

/* ---------- Tables ---------- */
.table-wrap{ overflow-x:auto; border-radius:var(--radius-m); }
table.dt{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
table.dt thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-500); font-weight:700; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; }
table.dt thead th:first-child{ border-top-left-radius:var(--radius-m); }
table.dt thead th:last-child{ border-top-right-radius:var(--radius-m); }
table.dt tbody td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
table.dt tbody tr:last-child td{ border-bottom:none; }
table.dt tbody tr.clickable{ cursor:pointer; }
table.dt tbody tr.clickable:hover{ background:var(--surface-2); }
table.dt tbody tr.clickable:hover .row-chevron svg{ transform:translateX(2px); color:var(--accent-600); }
.dt-name{ font-weight:600; color:var(--ink-900); }
.dt-sub{ font-size:11.5px; color:var(--ink-500); }
.row-chevron{ width:28px; padding-left:4px !important; padding-right:14px !important; color:var(--ink-400); }
.row-chevron svg{ transition:transform .12s ease, color .12s ease; display:block; }
.table-toolbar{ display:flex; align-items:center; gap:10px; padding:14px 16px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
.table-toolbar .spacer{ flex:1; }
.search-box{ display:flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; min-width:200px; }
.search-box input{ border:none; background:none; padding:0; font-size:13px; width:100%; }
.search-box input:focus-visible{ outline:none; }
.filter-select{ padding:7px 10px; }
select.filter-select{ width:auto; font-size:12.5px; border-radius:8px; }
.table-foot{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; font-size:12px; color:var(--ink-500); }
.pager{ display:flex; gap:4px; }
.pager button{ width:28px; height:28px; border-radius:6px; border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:12px; color:var(--ink-700); }
.pager button.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.pager button:disabled{ opacity:.4; cursor:not-allowed; }

/* ---------- Progress ---------- */
.progress-track{ height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.progress-fill{ height:100%; border-radius:99px; background:var(--accent); }
.progress-fill.good{ background:var(--good); }
.progress-fill.warning{ background:var(--warning); }
.progress-fill.critical{ background:var(--critical); }
.progress-row{ display:flex; align-items:center; gap:10px; }
.progress-row .progress-track{ flex:1; }
.progress-row .pv{ font-family:var(--font-mono); font-size:12px; font-weight:600; width:38px; text-align:right; }

.ring-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; }
.ring-wrap .ring-val{ position:absolute; font-family:var(--font-display); font-weight:600; }

/* ---------- Tabs ---------- */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); overflow-x:auto; margin-bottom:20px; }
.tab-btn{ padding:11px 15px; font-size:13px; font-weight:600; color:var(--ink-500); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
.tab-btn svg{ opacity:.7; }
.tab-btn.active svg{ opacity:1; }
.tab-btn:hover{ color:var(--ink-900); }
.tab-btn.active{ color:var(--accent); border-bottom-color:var(--accent); }

/* ---------- Patient header ---------- */
.patient-header{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px 24px; margin-bottom:18px; }
.ph-top{ display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.ph-id{ display:flex; align-items:center; gap:16px; }
.ph-av{ width:52px; height:52px; border-radius:14px; background:var(--accent-soft); color:var(--accent-soft-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:19px; flex-shrink:0; }
.ph-name{ font-size:20px; }
.ph-meta{ display:flex; gap:12px; align-items:center; color:var(--ink-500); font-size:12.5px; margin-top:4px; flex-wrap:wrap; }
.ph-meta .sep{ width:3px; height:3px; border-radius:50%; background:var(--ink-400); }
.ph-facts{ display:flex; gap:26px; margin-top:16px; flex-wrap:wrap; }

  ctx.font='11px IBM Plex Sans, system-ui, sans-serif';
  yAxis.ticks.forEach(function(t){
    var ty = yAt(t);
    if(showYGrid){ ctx.strokeStyle=gridColor; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(p.x, ty+0.5); ctx.lineTo(p.x+p.w, ty+0.5); ctx.stroke(); }

    ctx.fillText(String(Math.round(t*10)/10), p.x-8, ty);
  });

  var step = this._xTickStep(n);
  ctx.textAlign='center'; ctx.textBaseline='top';
  labels.forEach(function(lb,i){
    if(i%step!==0 && i!==n-1) return;

    if(!ds.fill) return;
    var pts = (ds.data||[]).map(function(v,i){ return v==null? null : {x:xAt(i), y:yAt(v)}; });

    var pts = (ds.data||[]).map(function(v,i){ return v==null? null : {x:xAt(i), y:yAt(v)}; });
    ctx.beginPath();
    ctx.strokeStyle = ds.borderColor || '#2a78d6';
    ctx.lineWidth = ds.borderWidth || 2;
    if(ds.borderDash && ds.borderDash.length) ctx.setLineDash(ds.borderDash); else ctx.setLineDash([]);
    var started=false;
    pts.forEach(function(pt){
      if(!pt){ started=false; return; }
      if(!started){ ctx.moveTo(pt.x, pt.y); started=true; } else ctx.lineTo(pt.x, pt.y);

    ctx.setLineDash([]);
    if(n<=40){
      pts.forEach(function(pt){
        if(!pt) return;

MiniChart.prototype._drawBar = function(){
  var ctx=this.ctx, p=this.plot;
  var labels = this.data.labels||[];
  var datasets = this.data.datasets||[];
  var horizontal = this.o.indexAxis==='y';
  var gridColor = '#e6e5df', tickColor='#8a8983';
  var n = labels.length;
  var dsCount = datasets.length || 1;
  var yAxis = computeYAxis(this._dataMax(datasets), undefined);
  this._barRects = [];
  var self = this;

  if(!horizontal){
    ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.font='11px IBM Plex Sans, system-ui, sans-serif';
    yAxis.ticks.forEach(function(t){
      var ty = p.y + p.h - (t/(yAxis.max||1))*p.h;
      ctx.strokeStyle=gridColor; ctx.beginPath(); ctx.moveTo(p.x, ty+0.5); ctx.lineTo(p.x+p.w, ty+0.5); ctx.stroke();
      ctx.fillStyle=tickColor; ctx.fillText(String(Math.round(t*10)/10), p.x-8, ty);
    });
    ctx.strokeStyle=gridColor; ctx.beginPath(); ctx.moveTo(p.x,p.y+p.h+0.5); ctx.lineTo(p.x+p.w,p.y+p.h+0.5); ctx.stroke();

    var catW = n>0 ? p.w/n : p.w;
    var maxThick = (datasets[0]&&datasets[0].maxBarThickness) || 28;
    var groupW = Math.min(catW*0.62, maxThick*dsCount+dsCount*3);
    var barW = Math.min(maxThick, groupW/dsCount);
    var step = this._xTickStep(n);
    ctx.textAlign='center'; ctx.textBaseline='top';
    labels.forEach(function(lb,i){
      var cx = p.x + catW*i + catW/2;
      if(i%step===0 || i===n-1){ ctx.fillStyle=tickColor; ctx.fillText(String(lb).length>10?String(lb).slice(0,9)+'…':String(lb), cx, p.y+p.h+7); }
      datasets.forEach(function(ds,di){
        var v = (ds.data||[])[i]||0;
        var bh = (v/(yAxis.max||1))*p.h;
        var bx = cx - groupW/2 + di*barW;
        var by = p.y+p.h-bh;
        ctx.fillStyle = (i===self._hoverIdx) ? shade(ds.backgroundColor,-10) : (ds.backgroundColor||'#2a78d6');
        roundRectTop(ctx, bx, by, barW-2, bh, ds.borderRadius||4);
        ctx.fill();
        self._barRects.push({x:bx,y:by,w:barW-2,h:Math.max(bh,1),i:i,v:v,ds:ds});
      });
    });
  } else {
    ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.font='11px IBM Plex Sans, system-ui, sans-serif';
    var rowH = n>0? p.h/n : p.h;
    var barH = Math.min(rowH*0.55, (datasets[0]&&datasets[0].maxBarThickness)||18);
    labels.forEach(function(lb,i){
      var cy = p.y + rowH*i + rowH/2;
      ctx.fillStyle=tickColor;
      var label = String(lb).length>14? String(lb).slice(0,13)+'…' : String(lb);
      ctx.fillText(label, p.x-8, cy);
      datasets.forEach(function(ds){
        var v = (ds.data||[])[i]||0;
        var bw = (v/(yAxis.max||1))*p.w;
        var by = cy-barH/2;
        ctx.fillStyle = (i===self._hoverIdx) ? shade(ds.backgroundColor,-10) : (ds.backgroundColor||'#2a78d6');
        roundRectRight(ctx, p.x, by, bw, barH, ds.borderRadius||4);
        ctx.fill();
        self._barRects.push({x:p.x,y:by,w:Math.max(bw,1),h:barH,i:i,v:v,ds:ds});
      });
    });
    ctx.strokeStyle=gridColor;
    yAxis.ticks.forEach(function(t){
      var tx = p.x + (t/(yAxis.max||1))*p.w;
      ctx.beginPath(); ctx.moveTo(tx+0.5,p.y); ctx.lineTo(tx+0.5,p.y+p.h); ctx.stroke();
    });
  }
  this._barGeom = { horizontal: horizontal, n: n, labels: labels, datasets: datasets, yAxis: yAxis };
};

MiniChart.prototype._drawDoughnut = function(){
  var ctx=this.ctx, p=this.plot;
  var ds = (this.data.datasets||[])[0] || {data:[],backgroundColor:[]};
  var data = ds.data||[];
  var colors = ds.backgroundColor||[];
  var total = data.reduce(function(a,b){ return a+(b||0); },0);
  var cx = p.x+p.w/2, cy = p.y+p.h/2;
  var r = Math.min(p.w,p.h)/2 - 4;
  var cutoutPct = parseFloat(this.o.cutout || '68%')/100;
  var innerR = r*cutoutPct;
  var start = -Math.PI/2;
  this._arcs=[];
  if(total<=0){
    ctx.beginPath(); ctx.strokeStyle='#e6e5df'; ctx.lineWidth=Math.max(2,r-innerR); ctx.arc(cx,cy,(r+innerR)/2,0,Math.PI*2); ctx.stroke();
    return;
  }
  var self = this;
  data.forEach(function(v,i){
    var frac = (v||0)/total;
    var end = start + frac*Math.PI*2;
    var hovered = self._hoverArc===i;
    var rr = hovered? r+3 : r;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(start)*innerR, cy+Math.sin(start)*innerR);
    ctx.arc(cx,cy,rr,start,end);
    ctx.arc(cx,cy,innerR,end,start,true);
    ctx.closePath();
    ctx.fillStyle = colors[i]||'#2a78d6';
    ctx.fill();
    if(ds.borderWidth){ ctx.lineWidth=ds.borderWidth; ctx.strokeStyle = ds.borderColor||'#fff'; ctx.stroke(); }
    self._arcs.push({start:start,end:end,i:i,v:v});
    start = end;
  });
};

MiniChart.prototype._tipRowsHTML = function(rows, title){
  var html = '';
  if(title) html += '<div style="font-family:IBM Plex Mono,monospace;font-size:11px;opacity:.85;margin-bottom:4px">'+escHtml(title)+'</div>';
  rows.forEach(function(r){
    html += '<div style="display:flex;align-items:center;gap:6px;white-space:nowrap">'+(r.color? '<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+r.color+'"></span>':'')+'<span>'+escHtml(r.text)+'</span></div>';
  });
  return html;
};

MiniChart.prototype._showTip = function(x,y,html){
  this._tip.innerHTML = html;
  this._tip.style.display='block';
  var pad=14;
  var left = x+pad, top = y+pad;
  var tw = this._tip.offsetWidth, th=this._tip.offsetHeight;
  if(left+tw > window.innerWidth-8) left = x-tw-pad;
  if(top+th > window.innerHeight-8) top = y-th-pad;
  this._tip.style.left = left+'px';
  this._tip.style.top = top+'px';
};

MiniChart.prototype._hideTip = function(){ this._tip.style.display='none'; };

MiniChart.prototype._onMove = function(e){
  var rect = this.canvas.getBoundingClientRect();
  var mx = e.clientX-rect.left, my = e.clientY-rect.top;
  if(this.type==='line') this._hoverLine(mx,my,e);
  else if(this.type==='bar') this._hoverBar(mx,my,e);
  else if(this.type==='doughnut') this._hoverDoughnut(mx,my,e);
};

MiniChart.prototype._onLeave = function(){
  this._hoverIdx=null; this._hoverArc=null;
  this._hideTip();
  this._draw();
};

MiniChart.prototype._hoverLine = function(mx,my,e){
  var g=this._lineGeom; if(!g || g.n===0) return;
  var p=this.plot;
  if(mx<p.x-10 || mx>p.x+p.w+10 || my<p.y-10 || my>p.y+p.h+20){ this._hoverIdx=null; this._hideTip(); this._draw(); return; }
  var stepX = g.n>1? p.w/(g.n-1) : 0;
  var idx = stepX? Math.round((mx-p.x)/stepX) : 0;
  idx = Math.max(0, Math.min(g.n-1, idx));
  this._hoverIdx = idx;
  var callbacks = (this.o.plugins && this.o.plugins.tooltip && this.o.plugins.tooltip.callbacks) || {};
  var rows = g.datasets.map(function(ds){
    var v = (ds.data||[])[idx];
    var text;
    if(callbacks.label){
      try{ text = callbacks.label({parsed:{y:v,x:idx}, label:String(g.labels[idx]), dataset:{label:ds.label}, raw:v}); }
      catch(err){ text = (ds.label||'')+': '+v; }
    } else {
      text = (ds.label? ds.label+': ':'')+(v==null?'–':v);
    }
    return { color: ds.borderColor, text: text };
  });
  this._showTip(e.clientX, e.clientY, this._tipRowsHTML(rows, String(g.labels[idx])));
  this._draw();
};

MiniChart.prototype._hoverBar = function(mx,my,e){
  var rects=this._barRects||[];
  var hit=null;
  for(var i=0;i<rects.length;i++){ var r=rects[i]; if(mx>=r.x && mx<=r.x+r.w && my>=r.y && my<=r.y+r.h){ hit=r; break; } }
  if(!hit){ this._hoverIdx=null; this._hideTip(); this._draw(); return; }
  this._hoverIdx = hit.i;
  var label = (this._barGeom.labels||[])[hit.i];
  var text = (hit.ds.label? hit.ds.label+': ':'')+hit.v;
  this._showTip(e.clientX, e.clientY, this._tipRowsHTML([{color:hit.ds.backgroundColor,text:text}], String(label)));
  this._draw();
};

MiniChart.prototype._hoverDoughnut = function(mx,my,e){
  var p=this.plot;
  var cx=p.x+p.w/2, cy=p.y+p.h/2;
  var dx=mx-cx, dy=my-cy;
  var dist = Math.sqrt(dx*dx+dy*dy);
  var r = Math.min(p.w,p.h)/2-4;
  var cutoutPct = parseFloat(this.o.cutout||'68%')/100;
  var innerR = r*cutoutPct;
  if(dist<innerR-2 || dist>r+6){ this._hoverArc=null; this._hideTip(); this._draw(); return; }
  var ang = Math.atan2(dy,dx);
  if(ang < -Math.PI/2) ang += Math.PI*2;
  var arc = null;
  (this._arcs||[]).forEach(function(a){ if(ang>=a.start && ang<=a.end) arc=a; });
  if(!arc){ this._hoverArc=null; this._hideTip(); this._draw(); return; }
  this._hoverArc = arc.i;
  var ds = (this.data.datasets||[])[0]||{};
  var labels = this.data.labels||[];
  var total = (ds.data||[]).reduce(function(a,b){ return a+(b||0); },0);
  var pct = total? Math.round(arc.v/total*100) : 0;
  var text = (labels[arc.i]||'')+': '+arc.v+' ('+pct+'%)';
  this._showTip(e.clientX, e.clientY, this._tipRowsHTML([{color:(ds.backgroundColor||[])[arc.i], text:text}]));
  this._draw();
};

window.Chart = MiniChart;

})();

function safeDiv(n,d){ return d ? n/d : 0; }
function initials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(prefix){ STATE._uidCounter = (STATE._uidCounter||1000)+1; return prefix+'-'+STATE._uidCounter; }
function statusBadgeClass(status){
  const map = {
    'Active':'good','Completed':'info','New':'accent','Assessment Pending':'warning','Paused':'warning','Discontinued':'critical',
    'Available':'good','Requested':'accent','Assigned':'info','In Use':'good','Maintenance':'warning','Issue Detected':'critical',
    'Awaiting Engineer':'warning','Cleared':'good','Offline':'neutral',
    'Open':'critical','Under Investigation':'warning','Resolved':'info','Verification':'accent','Investigating':'warning',
    'Critical':'critical','High':'serious','Medium':'warning','Low':'neutral',
    'On Track':'good','At Risk':'warning','Behind':'critical',
  };
  return map[status] || 'neutral';
}
function badge(text, cls){ cls = cls || statusBadgeClass(text); return `<span class="badge badge-${cls}"><span class="dot"></span>${esc(text)}</span>`; }
function rowChevron(){ return `<td class="row-chevron">${ic('chevron',null,14)}</td>`; }
function toast(msg, tone){
  tone = tone || 'good';
  const colorVar = {good:'var(--good)',info:'var(--info)',warning:'var(--warning)',critical:'var(--critical)'}[tone] || 'var(--good)';
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="dot" style="background:${colorVar}"></span><span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 3400);
}
function stars(n,max){ max = max||3; let out=''; for(let i=0;i<max;i++){ out += `<svg width="13" height="13" viewBox="0 0 24 24" style="display:inline-block;vertical-align:-2px" fill="${i<n?'var(--warning)':'none'}" stroke="${i<n?'var(--warning)':'var(--border-strong)'}" stroke-width="1.6">${ICONS.star}</svg>`; } return out; }

/* ---------------- Patients, plans, sessions, trials, assessments ---------------- */
function genFullPatients(devices){
  const patients = [];
  const specialCount = 14;
  // Deterministic status plan, indexed by patient idx (0-13). Chosen — not shuffled — so that
  // round-robin therapist assignment (idx % 4) gives EVERY therapist at least 2 data-rich
  // (Active/Paused/Completed/Discontinued) patients plus 1-2 empty-state ones, no matter which
  // demo account is used. Pool: 6 Active, 1 Paused, 2 Completed, 1 Discontinued, 2 New, 2 Assessment Pending.
  const statusPlan = [
    'Active','Active','Active','Active','Active','Active',      // idx 0-5  (2 per therapist, round-robin)
    'Completed','Completed','Paused','Discontinued',             // idx 6-9  (1 per therapist)
    'New','New','Assessment Pending','Assessment Pending',       // idx 10-13 (1 per therapist)
  ];
  const therapistList = usersByRole('therapist');
  // Force a handful of very recent registrations (on compatible statuses only) so the
  // Today/Week inflow ranges show real activity rather than all-zero bars.
  const recentOverrides = {};
  const recentDaysNoPlan = [0,1,3]; // safe for New / Assessment Pending — no plan is generated for these
  const recentDaysActive = [11,16]; // Active needs a few elapsed days once the plan starts (registration + 2-6d)
  let npi = 0, api = 0;
  statusPlan.forEach((s,i)=>{
    if(i===0) return;
    if((s==='New'||s==='Assessment Pending') && npi<recentDaysNoPlan.length){ recentOverrides[i]=recentDaysNoPlan[npi]; npi++; }
    else if(s==='Active' && api<recentDaysActive.length){ recentOverrides[i]=recentDaysActive[api]; api++; }
  });
  for(let i=0;i<specialCount;i++){
    const status = i===0 ? 'Active' : statusPlan[i];
    const therapistId = therapistList[i%4].id;
    const p = makePatientCore(i, i===0? 'Ananya' : null, status, recentOverrides[i], therapistId);
    if(i===0){ p.id='P-00124'; p.name='Ananya R.'; p.age=52; p.gender='Female'; p.diagnosis='Ischemic Stroke — Right MCA territory'; p.affectedSide='Left';
      p.therapistId='U-T1'; p.registrationDate = addDays(TODAY,-58); p.strokeDate = addDays(p.registrationDate,-14);
      p.mobilityStatus='Ambulatory with cane'; p.therapyGoals=['Restore independent reach above shoulder height','Improve functional grasp for self-feeding'];
    }
    p.status = status;
    patients.push(p);
  }

  patients.forEach((p, pi)=>{
    // Documents
    const docTypes = ['Referral Letter','Clinical Notes','Medical Report','Previous Assessment','Consent Form'];
    const nDocs = randInt(2,4);
    p.documents = [];
    for(let i=0;i<nDocs;i++){
      p.documents.push({
        id: uid('DOC'), name: docTypes[i%docTypes.length]+' — '+p.name.split(' ')[0]+'.pdf',
        type: i%3===0?'PDF':(i%3===1?'DOCX':'PDF'),
        uploadDate: addDays(p.registrationDate, randInt(0,4)),
        uploadedBy: getUser(p.therapistId).name, sizeKb: randInt(180,2400),
      });
    }

    // Notes
    p.notes = [
      { id: uid('NOTE'), author: getUser(p.therapistId).name, date: addDays(TODAY,-randInt(1,10)), text: pick([
        'Patient reports reduced fatigue during evening sessions. Continue current intensity.',
        'Mild increase in tone noted post-session; recommend extended warm-up.',
        'Family reports improved use of affected hand during meals at home.',
        'Discussed home exercise programme adherence — patient agreeable to a written schedule.',
      ])},
    ];

    // Assign 1-2 relevant device types based on affected side / diagnosis
    let devicePool;
    if(p.diagnosis.includes('Spinal')) devicePool = ['VEGA','MARS'];
    else if(p.mobilityStatus.includes('Wheelchair')||p.mobilityStatus.includes('walker')) devicePool = ['VEGA','PLUTO'];
    else devicePool = pick([['PLUTO','ORION'],['MARS','PLUTO'],['ORION','COSMOS'],['ATLAS','MARS'],['PLUTO','COSMOS']]);
    p.deviceTypesUsed = devicePool;

    const isEngaged = ['Active','Paused','Completed','Discontinued'].includes(p.status);
    p.assessments = [];
    p.plans = [];
    p.sessions = [];
    p.deviceAssignments = [];

    if(isEngaged){
      const atype = p.diagnosis.includes('Spinal')||p.mobilityStatus.includes('Wheel') ? assessmentType('BBS') : assessmentType('FMA');
      const planStart = addDays(p.registrationDate, randInt(2,6));
      let durationDays = p.status==='Completed' ? randInt(21,29) : (p.status==='Discontinued'? randInt(8,18) : randInt(24,35));
      const dailyTargetMin = pick([45,60,60,75]);
      const adherenceProfile = pi%4===0 ? 0.06 : (pi%4===1?0.14:(pi%4===2?0.22:0.32)); // miss probability baseline
      let elapsedDays = p.status==='Completed' ? durationDays : (p.status==='Discontinued'? randInt(6,durationDays-2) : clamp(daysBetween(planStart,TODAY)+1, 1, durationDays));
      elapsedDays = Math.max(1, Math.min(elapsedDays, durationDays));

      const plan = {
        id: uid('PLAN'), name: atype.id==='BBS' ? 'Lower-Limb & Balance Recovery Plan' : 'Upper-Limb Motor Recovery Plan',
        startDate: planStart, durationDays, dailyTargetMin, targetSessions: durationDays,
        devices: devicePool.slice(), goals: p.therapyGoals.slice(),
        notes: 'Progressive intensity plan with device-assisted repetitive task training.',
        status: p.status==='Discontinued' ? 'Discontinued' : (p.status==='Completed'?'Completed':(p.status==='Paused'?'Paused':'Active')),
        createdBy: p.therapistId, createdAt: planStart,
        versions: [],
        dayLog: [],
      };
      // Plan modification history for some patients
      if(pi%3===0){
        const modDate = addDays(planStart, Math.min(elapsedDays-2, 8));
        plan.versions.push({ id: uid('VER'), field:'Daily Target Duration', previous: (dailyTargetMin-15)+' min/day', new: dailyTargetMin+' min/day',
          modifiedBy: pi%2===0? getUser('U-C1').name : getUser(p.therapistId).name, modifiedByRole: pi%2===0?'consultant':'therapist',
          modifiedAt: modDate, reason:'Patient tolerating current load well; progressing intensity per protocol.' });
      }

      // Device assignment record
      const primaryDeviceType = devicePool[0];
      const candidateDevices = devices.filter(d=>d.typeId===primaryDeviceType);
      const assignedDevice = candidateDevices[pi % candidateDevices.length];
      p.deviceAssignments.push({ id: uid('ASSIGN'), deviceId: assignedDevice.id, assignedDate: planStart, status: (p.status==='Active'?'In Use':'Returned'),
        returnedDate: p.status==='Active'?null:addDays(planStart, elapsedDays) });
      if(p.status==='Active' && pi<11){ assignedDevice.currentPatientId = p.id; assignedDevice.status='In Use'; assignedDevice.location = 'Patient Home Kit'; }
      assignedDevice.history.push({ date: planStart, type:'assigned', text:`Assigned to patient ${p.id} (${p.name}) by ${getUser(p.therapistId).name}.` });

      // Baseline assessment
      let skillBase = rand(0.28,0.42);
      let skillGrowth = rand(0.25,0.55);
      function scoreFor(dayFrac, noise){ return clamp(skillBase + skillGrowth*dayFrac + rand(-noise,noise), 0.05, 0.97); }
      function makeAssessment(dayOffsetFrac, dateObj, label){
        const frac = scoreFor(dayOffsetFrac, 0.03);
        const items = atype.items.map(it=>({ label: it.label, max: it.max, score: Math.round(it.max*clamp(frac+rand(-0.08,0.08),0.03,1)) }));
        const score = items.reduce((s,it)=>s+it.score,0);
        return { id: uid('ASMT'), typeId: atype.id, version: atype.version, date: dateObj, therapistId: p.therapistId,
          score, maxScore: atype.maxScore, percentage: pct(score, atype.maxScore), items,
          notes: label==='Baseline' ? 'Baseline evaluation prior to device-assisted therapy commencement.' : 'Follow-up evaluation; reassessed after structured practice block.', label };
      }
      p.assessments.push(makeAssessment(0, addDays(planStart,-1), 'Baseline'));
      for(let d=7; d<elapsedDays; d+=7){
        p.assessments.push(makeAssessment(d/durationDays, addDays(planStart,d), 'Day '+d));
      }
      if(p.status==='Completed'){ p.assessments.push(makeAssessment(1, addDays(planStart,durationDays), 'Discharge')); }

      // Day log + sessions + trials
      let sessionCounter = 0;
      for(let d=1; d<=elapsedDays; d++){
        const date = addDays(planStart, d-1);
        const roll = RNG();
        let dayStatus;
        if(d>elapsedDays) dayStatus='upcoming';
        else if(roll < adherenceProfile*0.55) dayStatus='missed';
        else if(roll < adherenceProfile) dayStatus='partial';
        else dayStatus='done';
        let actualMin = 0;
        const daySessions = [];
        if(dayStatus==='done' || dayStatus==='partial'){
          const targetFrac = dayStatus==='done' ? rand(0.85,1.18) : rand(0.32,0.68);
          actualMin = dailyTargetMin*targetFrac;
          const nSessions = actualMin>50 && RNG()>0.55 ? 2 : 1;
          let remaining = actualMin;
          let dayTrialCounter = 0;
          for(let s=0;s<nSessions;s++){
            sessionCounter++;
            const dur = s===nSessions-1 ? remaining : remaining*rand(0.4,0.6);
            remaining -= dur;
            const startHour = 9 + s*2 + randInt(0,1);
            const startTime = new Date(date.getFullYear(),date.getMonth(),date.getDate(), startHour, randInt(0,59));
            const endTime = new Date(startTime.getTime()+dur*60000);
            const deviceForSession = devices.find(dd=>dd.id===assignedDevice.id);
            const nTrials = randInt(3,7);
            const dayFrac = d/durationDays;
            let cumTargets=0, cumHits=0, cumMisses=0, cumStars=0;
            const trials = [];
            let cursor = new Date(startTime);
            for(let t=1;t<=nTrials;t++){
              const trialType = pickWeighted(['GAME','GAME','GAME','AROM','PROM','APROM']);
              const dt = deviceType(deviceForSession.typeId);
              const game = trialType==='GAME' ? pick(dt.games) : null;
              const mechanism = pick(dt.mechanisms);
              const targets = trialType==='GAME' ? randInt(10,20) : randInt(6,14);
              const acc = clamp(scoreFor(dayFrac,0.07)+rand(-0.05,0.05),0.15,0.98);
              const hits = Math.round(targets*acc);
              const misses = targets-hits;
              const trialStars = acc>=0.85?3:acc>=0.62?2:acc>=0.4?1:0;
              const trialDurSec = randInt(45,150);
              const tStart = new Date(cursor);
              cursor = new Date(cursor.getTime()+trialDurSec*1000);
              cumTargets+=targets; cumHits+=hits; cumMisses+=misses; cumStars+=trialStars;
              dayTrialCounter++;
              trials.push({
                trialNumberDay: dayTrialCounter,
                trialNumberSession: t, trialType, game, mechanism, targets, hits, misses, stars:trialStars,
                startTime: tStart, stopTime: new Date(cursor), cumulativeTargets:cumTargets, cumulativeHits:cumHits, cumulativeMisses:cumMisses, cumulativeStars:cumStars,
                rawDataRef: `raw/${p.id}/${deviceForSession.id}/s${sessionCounter}t${t}.json`,
              });
            }
            daySessions.push({
              id: uid('SESS'), sessionNumber: sessionCounter, date, deviceId: deviceForSession.id, startTime, endTime,
              durationMin: dur, trials,
              accuracy: pct(cumHits, cumTargets), stars: cumStars, targets: cumTargets, hits: cumHits, misses: cumMisses,
            });
          }
        }
        plan.dayLog.push({ day:d, date, status:dayStatus, targetMin: dailyTargetMin, actualMin: Math.round(actualMin), sessionIds: daySessions.map(s=>s.id) });
        p.sessions.push(...daySessions);
      }
      // fill upcoming days for active plans (a few, for the timeline strip)
      for(let d=elapsedDays+1; d<=Math.min(durationDays, elapsedDays+6); d++){
        plan.dayLog.push({ day:d, date: addDays(planStart,d-1), status:'upcoming', targetMin: dailyTargetMin, actualMin:0, sessionIds:[] });
      }
      p.plans.push(plan);
      p.currentDay = Math.min(elapsedDays, durationDays);
    } else {
      p.currentDay = 0;
    }
  });
  return patients;
}

  const severities = ['Low','Medium','High','Critical'];
  devices.forEach((d,di)=>{

    const nMaint = randInt(1,3);
    for(let i=0;i<nMaint;i++){
      const date = addDays(TODAY, -randInt(15,300));
      maintenance.push({ id: uid('MTN'), deviceId:d.id, date, type: pick(['Scheduled Calibration','Firmware Update','Sensor Replacement','Preventive Inspection']),
        engineerId: pick(engineers).id, notes: pick(['Routine calibration completed; all axes within tolerance.','Firmware updated to latest stable release.','Replaced worn strap sensor; verified function.','Preventive inspection — no issues found.']) });
      d.history.push({ date, type:'maintenance', text:`Maintenance performed: ${maintenance[maintenance.length-1].type}.` });
    }
  });
  // create ~9 issues across devices with varied statuses
  const statuses = ['Open','Investigating','Investigating','Resolved','Resolved','Cleared','Cleared','Cleared','Open'];
  const issueDevices = devices.filter((d,i)=>i%2===0).concat(devices.slice(0,3));
  issueDevices.slice(0,9).forEach((d,i)=>{
    const status = statuses[i%statuses.length];
    const severity = pick(severities);
    const opened = addDays(TODAY, -randInt(1,40));
    const engineer = pick(engineers);
    const issue = {
      id: uid('ISS'), deviceId: d.id, description: pick(ISSUE_DESCRIPTIONS), severity, status,
      openedAt: opened, openedBy: pick(usersByRole('therapist')).id,
      engineerId: engineer.id,
      diagnostics: status!=='Open' ? 'Diagnostic sweep completed: sensor axis 2 reads 0.4mm drift over baseline; within recalibration range.' : null,
      troubleshooting: status==='Resolved'||status==='Cleared' ? [
        { at: addDays(opened,1), by: engineer.name, text:'Ran full self-diagnostic; isolated fault to axis-2 encoder calibration.' },
        { at: addDays(opened,2), by: engineer.name, text:'Recalibrated encoder and re-ran 20-cycle stress test — within tolerance.' },
      ] : (status==='Investigating' ? [{ at: addDays(opened,1), by: engineer.name, text:'Initial inspection in progress; running diagnostic sweep.' }] : []),
      partsReplaced: status==='Resolved'||status==='Cleared' ? pick([null,null,'Strap sensor module']) : null,
      resolution: status==='Resolved'||status==='Cleared' ? 'Recalibrated and stress-tested; performance restored to spec.' : null,
      resolvedAt: status==='Resolved'||status==='Cleared' ? addDays(opened,2) : null,
      clearedAt: status==='Cleared' ? addDays(opened,3) : null,
      verifiedBy: status==='Cleared' ? engineer.name : null,
    };
    issues.push(issue);
    d.history.push({ date: opened, type:'issue', text:`Issue reported (${severity}): ${issue.description}` });
    if(status==='Investigating'||status==='Resolved'||status==='Cleared') d.history.push({ date: addDays(opened,1), type:'investigating', text:`${engineer.name} began investigation.` });
    if(status==='Resolved'||status==='Cleared') d.history.push({ date: addDays(opened,2), type:'resolved', text:`Issue resolved by ${engineer.name}.` });
    if(status==='Cleared') d.history.push({ date: addDays(opened,3), type:'cleared', text:`Device cleared for patient use by ${engineer.name}.` });
    if(status==='Open') d.status='Issue Detected';
    else if(status==='Investigating') d.status='Awaiting Engineer';
  });
  return { issues, maintenance };
}

function genDeviceRequests(patients, devices){
  const requests = [];
  const sample = patients.filter(p=>['Active','Assessment Pending','New'].includes(p.status)).slice(0,6);
  sample.forEach((p,i)=>{

  return requests;
}

function visiblePatients(){
  const u = STATE.currentUser;
  if(!u) return [];
  if(u.role==='therapist') return STATE.patients.filter(p=>p.therapistId===u.id);
  if(u.role==='consultant' || u.role==='admin') return STATE.patients.slice();
  return [];
}
function currentPlan(patient){ return patient.plans && patient.plans.length ? patient.plans[patient.plans.length-1] : null; }
function planProgress(plan){
  if(!plan) return null;
  const completedDays = plan.dayLog.filter(d=>d.status==='done'||d.status==='partial').length;
  const missedDays = plan.dayLog.filter(d=>d.status==='missed').length;
  const loggedDays = plan.dayLog.filter(d=>d.status!=='upcoming').length;
  const targetTotal = plan.durationDays*plan.dailyTargetMin;
  const actualTotal = plan.dayLog.reduce((s,d)=>s+(d.actualMin||0),0);
  const expectedToDate = loggedDays*plan.dailyTargetMin;
  const adherence = expectedToDate ? clamp(pct(actualTotal, expectedToDate),0,140) : 0;
  const completionPct = pct(Math.min(loggedDays,plan.durationDays), plan.durationDays);
  const currentDay = Math.min(loggedDays, plan.durationDays);
  return { completedDays, missedDays, loggedDays, targetTotal, actualTotal, expectedToDate, adherence, completionPct, currentDay,
    remainingDays: Math.max(0, plan.durationDays-currentDay), remainingMin: Math.max(0,targetTotal-actualTotal) };
}
function patientStats(p){
  const plan = currentPlan(p);
  const prog = planProgress(plan);
  const sessions = p.sessions||[];
  const totalMin = sessions.reduce((s,ss)=>s+ss.durationMin,0);
  const totalTrials = sessions.reduce((s,ss)=>s+ss.trials.length,0);
  const totalStars = sessions.reduce((s,ss)=>s+ss.stars,0);
  const totalHits = sessions.reduce((s,ss)=>s+ss.hits,0);
  const totalTargets = sessions.reduce((s,ss)=>s+ss.targets,0);
  const avgAccuracy = totalTargets? pct(totalHits,totalTargets) : 0;
  const devicesUsed = [...new Set(sessions.map(s=>s.deviceId))];
  const gamesPlayed = [...new Set(sessions.flatMap(s=>s.trials.filter(t=>t.game).map(t=>t.game)))];
  const latestAssessment = p.assessments && p.assessments.length ? p.assessments[p.assessments.length-1] : null;
  const baselineAssessment = p.assessments && p.assessments.length ? p.assessments[0] : null;
  return { plan, prog, totalMin, totalTrials, totalStars, avgAccuracy, devicesUsed, gamesPlayed, sessionsCount: sessions.length, latestAssessment, baselineAssessment };
}
function deviceStats(d){
  const patientsUsing = STATE.patients.filter(p=>(p.sessions||[]).some(s=>s.deviceId===d.id));
  const sessions = [];
  STATE.patients.forEach(p=>(p.sessions||[]).forEach(s=>{ if(s.deviceId===d.id) sessions.push({...s, patientId:p.id, patientName:p.name}); }));
  const totalMin = sessions.reduce((s,ss)=>s+ss.durationMin,0);
  const totalTrials = sessions.reduce((s,ss)=>s+ss.trials.length,0);
  const totalStars = sessions.reduce((s,ss)=>s+ss.stars,0);
  const totalHits = sessions.reduce((s,ss)=>s+ss.hits,0);
  const totalTargets = sessions.reduce((s,ss)=>s+ss.targets,0);
  const avgAccuracy = totalTargets? pct(totalHits,totalTargets):0;
  const deviceIssues = STATE.issues.filter(i=>i.deviceId===d.id);
  const openIssues = deviceIssues.filter(i=>!['Cleared','Resolved'].includes(i.status));
  return { patientsUsing, sessions, totalMin, totalTrials, totalStars, avgAccuracy, deviceIssues, openIssues };
}
function fleetSummary(){
  const total = STATE.devices.length;
  const inUse = STATE.devices.filter(d=>d.status==='In Use'||d.status==='Assigned').length;
  const available = STATE.devices.filter(d=>d.status==='Available').length;
  const maintenance = STATE.devices.filter(d=>d.status==='Maintenance').length;
  const issueDetected = STATE.devices.filter(d=>d.status==='Issue Detected'||d.status==='Awaiting Engineer').length;
  const openIssues = STATE.issues.filter(i=>!['Cleared','Resolved'].includes(i.status)).length;
  const utilization = pct(inUse, total);
  return { total, inUse, available, maintenance, issueDetected, openIssues, utilization };
}
function programSummary(){
  const patients = STATE.patients;
  const total = patients.length;
  const active = patients.filter(p=>p.status==='Active').length;
  const newPatients = patients.filter(p=>daysBetween(p.registrationDate,new Date(TODAY))<=30).length;
  const completedPlans = patients.filter(p=>p.status==='Completed').length;
  const activePlans = patients.filter(p=>p.status==='Active' && currentPlan(p)).length;
  let totalSessions=0, totalDeviceSessions=0, totalHours=0;
  patients.forEach(p=>{ totalSessions += (p.sessions||[]).length; totalDeviceSessions += (p.sessions||[]).length; totalHours += (p.sessions||[]).reduce((s,ss)=>s+ss.durationMin,0)/60; });
  return { total, active, newPatients, completedPlans, activePlans, totalSessions, totalDeviceSessions, totalHours: Math.round(totalHours) };
}
function inflowSeries(range){
  // returns {labels:[], values:[]}
  const buckets = {};
  const order = [];
  STATE.patients.forEach(p=>{
    const d = new Date(p.registrationDate);
    let key, label;
    if(range==='today' || range==='week'){ key = d.toISOString().slice(0,10); label = fmtDateShort(d); }
    else if(range==='month'){ key = d.toISOString().slice(0,10); label = fmtDateShort(d); }
    else { key = d.getFullYear()+'-'+pad(d.getMonth()+1); label = d.toLocaleDateString('en-US',{month:'short',year:'2-digit'}); }
    if(!(key in buckets)){ buckets[key]=0; order.push({key,label,d}); }
    buckets[key]++;
  });
  let daysBack = range==='today'?1:range==='week'?7:range==='month'?30:365;
  const labels=[], values=[];
  if(range==='year'){
    for(let i=11;i>=0;i--){
      const d = new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1);
      const key = d.getFullYear()+'-'+pad(d.getMonth()+1);
      labels.push(d.toLocaleDateString('en-US',{month:'short'}));
      values.push(buckets[key]||0);
    }
  } else {
    for(let i=daysBack-1;i>=0;i--){
      const d = addDays(TODAY,-i);
      const key = d.toISOString().slice(0,10);
      labels.push(fmtDateShort(d));
      values.push(buckets[key]||0);
    }
  }
  return { labels, values };
}
function deviceUtilByType(){
  return DEVICE_TYPES.map(dt=>{
    const units = STATE.devices.filter(d=>d.typeId===dt.id);
    const inUse = units.filter(d=>d.status==='In Use'||d.status==='Assigned').length;
    return { type:dt, units: units.length, inUse, pct: pct(inUse, units.length||1) };
  });
}

  STATE.patients.forEach(p=>{ map[p.status]=(map[p.status]||0)+1; });
  return map;
}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const [pathPart, queryPart] = h.split('?');
  const segs = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart) queryPart.split('&').forEach(kv=>{ const [k,v]=kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v||''); });
  return { page: segs[0]||'overview', id: segs[1]||null, query };
}
function navigate(hash){ location.hash = hash; }

function globalSearch(q){
  q = (q||'').toLowerCase().trim();
  if(!q.length) return {patients:[],devices:[],sessions:[],plans:[],assessments:[]};
  const pts = visiblePatients().filter(p=>p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)).slice(0,5);
  const devs = STATE.currentUser.role!=='consultant' ? STATE.devices.filter(d=>d.id.toLowerCase().includes(q)||d.serial.toLowerCase().includes(q)).slice(0,5) : [];
  const plans = [];
  const assessments = [];
  visiblePatients().forEach(p=>{ (p.plans||[]).forEach(plan=>{ if(plan.name.toLowerCase().includes(q)) plans.push({p,plan}); });
    (p.assessments||[]).forEach(a=>{ if(assessmentType(a.typeId).name.toLowerCase().includes(q)) assessments.push({p,a}); }); });
  return { patients:pts, devices:devs, sessions:[], plans:plans.slice(0,5), assessments:assessments.slice(0,5) };
}

function outsideDropdownHandler(e){
  if(!STATE.dropdownOpen) return;
  const dd = document.querySelector('.dropdown');
  if(dd && !dd.contains(e.target) && !e.target.closest('.icon-btn') && !e.target.closest('.user-btn')){ STATE.dropdownOpen=null; render(); }

function statusDonutBlock(canvasId, patients){
  const dist = {}; patients.forEach(p=>dist[p.status]=(dist[p.status]||0)+1);
  const labels = Object.keys(dist); const data = Object.values(dist);
  const colors = labels.map(l=>{ const c = statusBadgeClass(l); return {good:cssVar('--good'),warning:cssVar('--warning'),critical:cssVar('--critical'),accent:cssVar('--accent'),info:cssVar('--info'),neutral:cssVar('--ink-400'),serious:cssVar('--serious')}[c]; });
  PAGE_CHART_HOOK = chainHook(PAGE_CHART_HOOK, ()=>donutChart(canvasId, labels, data, colors));
  return `<div style="display:flex;align-items:center;gap:18px"><div class="chart-box" style="width:130px;height:130px;flex-shrink:0"><canvas id="${canvasId}"></canvas></div>
  <div class="legend-row" style="flex-direction:column;gap:8px">${labels.map((l,i)=>`<div class="legend-item"><span class="sw" style="background:${colors[i]}"></span>${esc(l)} <span class="mono muted">(${data[i]})</span></div>`).join('')}</div></div>`;
}

function renderPatientsList(){
  PAGE_CHART_HOOK = null;
  const f = STATE.patientsFilter;

  if(f.q) list = list.filter(p=>p.name.toLowerCase().includes(f.q.toLowerCase())||p.id.toLowerCase().includes(f.q.toLowerCase()));
  if(f.status!=='all') list = list.filter(p=>p.status===f.status);
  if(f.therapist!=='all') list = list.filter(p=>p.therapistId===f.therapist);
  if(f.device!=='all') list = list.filter(p=>(p.deviceTypesUsed||[]).includes(f.device));
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total/f.pageSize));
  f.page = Math.min(f.page, pages);
  const pageItems = list.slice((f.page-1)*f.pageSize, f.page*f.pageSize);
  const therapists = usersByRole('therapist');
  const canCreate = STATE.currentUser.role==='therapist';

  const rows = pageItems.map(p=>{

    return `<tr class="clickable" onclick="App_go('#/patientprofile/${p.id}')">

  return `
  <div class="page-head"><div><h1>${STATE.currentUser.role==='therapist'?'My Patients':'Patients'}</h1><div class="sub">${total} patient${total!==1?'s':''} ${STATE.currentUser.role==='therapist'?'under your care':'across the program'}.</div></div>

  </div>
  <div class="card">
    <div class="table-toolbar">
      <div class="search-box" style="width:240px">${ic('search',null,14)}<input placeholder="Search name or ID…" value="${esc(f.q)}" oninput="patientsFilterUpdate('q',this.value)"></div>
      <select class="filter-select" onchange="patientsFilterUpdate('status',this.value)">
        <option value="all">All statuses</option>
        ${['New','Assessment Pending','Active','Paused','Completed','Discontinued'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      ${STATE.currentUser.role!=='therapist'?`<select class="filter-select" onchange="patientsFilterUpdate('therapist',this.value)">
        <option value="all">All therapists</option>${therapists.map(t=>`<option value="${t.id}" ${f.therapist===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
      </select>`:''}
      <select class="filter-select" onchange="patientsFilterUpdate('device',this.value)">
        <option value="all">All devices</option>${DEVICE_TYPES.map(d=>`<option value="${d.id}" ${f.device===d.id?'selected':''}>${d.name}</option>`).join('')}
      </select>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" onclick="patientsFilterReset()">${ic('filter','',13)} Reset</button>
    </div>
    <div class="table-wrap"><table class="dt"><thead><tr><th>Patient</th><th>Current Plan</th><th>Status</th><th>Adherence</th><th></th></tr></thead>

    <div class="table-foot"><span>Showing ${pageItems.length? ((f.page-1)*f.pageSize+1):0}–${Math.min(f.page*f.pageSize,total)} of ${total}</span>
      <div class="pager">
        <button ${f.page<=1?'disabled':''} onclick="patientsPage(${f.page-1})">${ic('chevron','',12)}</button>
        ${Array.from({length:pages},(_,i)=>i+1).slice(0,6).map(n=>`<button class="${n===f.page?'active':''}" onclick="patientsPage(${n})">${n}</button>`).join('')}

      </div>
    </div>
  </div>`;
}

    mobilityStatus: document.getElementById('np-mobility').value,
    therapyGoals: [document.getElementById('np-goals').value || 'To be determined at initial assessment'],
    initialObservations: document.getElementById('np-obs').value || 'Pending initial clinical observation.',
    clinicalInfo: document.getElementById('np-clinical').value || 'None reported.',
    notes: document.getElementById('np-notes').value ? [{id:uid('NOTE'),author:STATE.currentUser.name,date:new Date(TODAY),text:document.getElementById('np-notes').value}] : [],
    status:'Assessment Pending', documents: STATE.newPatientDocs.map(d=>({id:uid('DOC'),name:d.name,type:d.type,uploadDate:new Date(TODAY),uploadedBy:STATE.currentUser.name,sizeKb:randInt(200,1800)})),
    assessments:[], plans:[], sessions:[], deviceAssignments:[], deviceTypesUsed:[], currentDay:0,
  };
  STATE.patients.unshift(p);

};

    </div>

function assessmentTrendChart(canvasId, p){
  const groups = {};
  p.assessments.forEach(a=>{ (groups[a.typeId]=groups[a.typeId]||[]).push(a); });
  const datasets = Object.keys(groups).map((k,i)=>({ label: assessmentType(k).name, data: groups[k].map(a=>a.percentage), color: catColor(i) }));
  const labels = groups[Object.keys(groups)[0]].map(a=>a.label);
  lineChart(canvasId, labels, datasets, { legend:true, suggestedMax:100 });
}
function therapyActivityChart(canvasId, p){
  const plan = currentPlan(p);
  const labels = plan.dayLog.filter(d=>d.status!=='upcoming').map(d=>'D'+d.day);
  const target = plan.dayLog.filter(d=>d.status!=='upcoming').map(()=>plan.dailyTargetMin);
  const actual = plan.dayLog.filter(d=>d.status!=='upcoming').map(d=>d.actualMin);
  mkChart(canvasId, { type:'bar', data:{ labels, datasets:[
    { label:'Actual minutes', data:actual, backgroundColor: cssVar('--accent'), borderRadius:3, maxBarThickness:16 },
    { type:'line', label:'Target', data:target, borderColor: cssVar('--ink-400'), borderDash:[4,3], borderWidth:1.5, pointRadius:0, tension:0 },
  ]}, options:{ responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:true, labels:{color:inkText(),font:chartDefaultsFont(),usePointStyle:true,boxWidth:8}}, tooltip:tooltipBase() },
    scales:{ x:{grid:{display:false}, ticks:{color:inkMuted(),font:chartDefaultsFont(),maxTicksLimit:10}}, y:{grid:{color:gridColor()}, ticks:{color:inkMuted(),font:chartDefaultsFont()}} } } });
}

function sessionDaySeries(p){
  const plan = currentPlan(p);
  const map = {};
  (p.sessions||[]).forEach(s=>{ const k = new Date(s.date).toISOString().slice(0,10); map[k]=map[k]||{targets:0,hits:0,stars:0}; map[k].targets+=s.targets; map[k].hits+=s.hits; map[k].stars+=s.stars; });
  const days = plan.dayLog.filter(d=>d.status!=='upcoming');
  return days.map(d=>{ const k = new Date(d.date).toISOString().slice(0,10); const v = map[k]||{targets:0,hits:0,stars:0}; return { day:d.day, date:d.date, accuracy: v.targets?pct(v.hits,v.targets):null, stars:v.stars }; });
}

function gameDistributionBlock(canvasId, p){

function buildPatientTimeline(p){
  const evs = [];
  evs.push({ date:p.registrationDate, icon:'users', tone:'accent', title:'Patient registered', desc:`Registered by ${getUser(p.therapistId).name}` });
  (p.assessments||[]).forEach(a=>evs.push({ date:a.date, icon:'clipboard', tone:'info', title:assessmentType(a.typeId).name+' completed', desc:`Score: ${a.score}/${a.maxScore} (${a.percentage}%)` }));
  (p.plans||[]).forEach(pl=>{ evs.push({ date:pl.createdAt, icon:'target', tone:'accent', title:'Therapy plan created', desc:pl.name });
    pl.versions.forEach(v=>evs.push({ date:v.modifiedAt, icon:'edit', tone:'warning', title:'Plan modified', desc:`${v.field}: ${v.previous} → ${v.new} (by ${v.modifiedBy})` })); });
  (p.deviceAssignments||[]).forEach(a=>evs.push({ date:a.assignedDate, icon:'link', tone:'good', title:'Device assigned', desc:`${a.deviceId} assigned for therapy` }));
  (p.documents||[]).forEach(d=>evs.push({ date:d.uploadDate, icon:'file', tone:'neutral', title:'Document uploaded', desc:d.name }));
  const byDay = {};
  (p.sessions||[]).forEach(s=>{ const k=new Date(s.date).toISOString().slice(0,10); byDay[k]=byDay[k]||{min:0,device:s.deviceId,n:0}; byDay[k].min+=s.durationMin; byDay[k].n++; });
  Object.keys(byDay).forEach(k=>evs.push({ date:new Date(k), icon:'activity', tone:'good', title:'Therapy session'+(byDay[k].n>1?'s':''), desc:`${byDay[k].device} · ${fmtMin(byDay[k].min)}` }));
  return evs.sort((a,b)=>new Date(b.date)-new Date(a.date));
}

window.recalcAssessmentTotal = function(n){
  const at = assessmentType(STATE.newAssessmentType);
  let total=0; for(let i=0;i<n;i++){ total += +(document.getElementById('am-item-'+i).value||0); }
  document.getElementById('am-total').innerHTML = `${total} / ${at.maxScore} <span style="font-size:13px;color:var(--ink-500)">(${pct(total,at.maxScore)}%)</span>`;
};
window.submitAssessment = function(e, pid){
  e.preventDefault();
  const p = getPatient(pid); const at = assessmentType(STATE.newAssessmentType);
  const items = at.items.map((it,i)=>({ label:it.label, max:it.max, score:+(document.getElementById('am-item-'+i).value||0) }));
  const score = items.reduce((s,it)=>s+it.score,0);
  const assessment = { id:uid('ASMT'), typeId:at.id, version:at.version, date:new Date(document.getElementById('am-date').value), therapistId:STATE.currentUser.id,
    score, maxScore:at.maxScore, percentage:pct(score,at.maxScore), items, notes: document.getElementById('am-notes').value || 'No additional notes.', label:'Follow-up' };
  p.assessments.push(assessment);
  if(p.status==='Assessment Pending') p.status='Active';
  STATE.auditLog.unshift({ id:uid('AUD'), user:STATE.currentUser.name, role:STATE.currentUser.role, action:'Assessment Created', entity:'Assessment', entityId:assessment.id, timestamp:new Date(TODAY), prev:null, new:`${score}/${at.maxScore}` });
  STATE.newAssessmentType = null;
  toast('Assessment saved successfully.','good');
  App_go('#/patientprofile/'+pid+'?tab=assessments');
};

function deviceUsageChart(canvasId, d){
  const days = 14; const labels=[]; const data=[];
  for(let i=days-1;i>=0;i--){ const day=addDays(TODAY,-i); labels.push(fmtDateShort(day));
    let min=0; STATE.patients.forEach(p=>(p.sessions||[]).forEach(s=>{ if(s.deviceId===d.id && daysBetween(s.date,new Date(day))===0) min+=s.durationMin; }));
    data.push(Math.round(min)); }
  barChart(canvasId, labels, [{label:'Minutes used', data, color:cssVar('--'+deviceType(d.typeId).series)}], {});
}

window.submitDeviceRequest = function(){
  const patientId = document.getElementById('dr-patient').value;
  const deviceTypeId = document.getElementById('dr-type').value;
  const notes = document.getElementById('dr-notes').value || 'No additional notes.';
  const req = { id: uid('REQ'), patientId, therapistId: STATE.currentUser.id, deviceTypeId, requestedAt: new Date(TODAY), status:'Pending Engineer Review', engineerId:null, notes };
  STATE.deviceRequests.unshift(req);
  STATE.notifications.unshift({ id:uid('NTF'), role:'engineer', userId:null, type:'request', tone:'info', icon:'box', title:'New device request', desc:`${STATE.currentUser.name} requested a ${deviceType(deviceTypeId).name} for ${getPatient(patientId).name}.`, time:new Date(TODAY), read:false, link:{page:'issues'} });
  STATE.showNewRequest = false;
  toast('Device request sent to engineering for review.','good'); render();

window.assignRequestedDevice = function(reqId){
  const req = STATE.deviceRequests.find(r=>r.id===reqId);
  askConfirm({ title:'Assign Device to Patient', tone:'warning', confirmLabel:'Assign Device',
    body:`This will assign a cleared ${deviceType(req.deviceTypeId).name} unit to ${getPatient(req.patientId).name} and mark it In Use. This action will be recorded.`,
    action: ()=>{
      const candidate = STATE.devices.find(d=>d.typeId===req.deviceTypeId && (d.status==='Available'||d.status==='Cleared'));
      if(!candidate){ toast('No cleared device of this type is currently available.','critical'); return; }
      candidate.status='In Use'; candidate.currentPatientId = req.patientId; candidate.location='Patient Home Kit';
      candidate.history.push({ date:new Date(TODAY), type:'assigned', text:`Assigned to patient ${req.patientId} by ${STATE.currentUser.name}.` });
      const p = getPatient(req.patientId);
      p.deviceAssignments.push({ id:uid('ASSIGN'), deviceId:candidate.id, assignedDate:new Date(TODAY), status:'In Use', returnedDate:null });
      req.status='Assigned';
      STATE.auditLog.unshift({ id:uid('AUD'), user:STATE.currentUser.name, role:STATE.currentUser.role, action:'Device Assignment', entity:'Device', entityId:candidate.id, timestamp:new Date(TODAY), prev:null, new:`Assigned to ${req.patientId}` });
      toast(candidate.id+' assigned to '+p.name+'.','good');
    }});
};

  ${pendingReqs.map(r=>`<tr><td>${esc(getUser(r.therapistId).name)}</td><td>${esc(getPatient(r.patientId).name)}</td><td>${deviceType(r.deviceTypeId).name}</td><td class="mono">${fmtDateShort(r.requestedAt)}</td>

    ${['Critical','High','Medium','Low'].map(s=>`<div class="card card-pad"><div class="k-label">${s} severity</div><div class="k-val" style="font-size:22px;margin-top:6px">${open.filter(i=>i.severity===s).length}</div></div>`).join('')}

function issueActionButton(i){
  if(i.status==='Open') return `<button class="btn btn-secondary btn-sm" onclick="investigateIssue('${i.id}')">${ic('search','',13)} Investigate</button>`;
  if(i.status==='Investigating') return `<button class="btn btn-secondary btn-sm" onclick="resolveIssueFlow('${i.id}')">${ic('check','',13)} Resolve</button>`;
  return '';
}
window.reviewClearRequest = function(reqId){
  const req = STATE.deviceRequests.find(r=>r.id===reqId);
  askConfirm({ title:'Clear Device for Assignment', tone:'good', confirmLabel:'Clear Device', needReason:false,
    body:`Confirm inspection is complete for a ${deviceType(req.deviceTypeId).name} unit requested by ${getUser(req.therapistId).name}. Clearing will make it assignable to ${getPatient(req.patientId).name}.`,
    action: ()=>{
      req.status='Cleared — Ready to Assign'; req.engineerId = STATE.currentUser.id;
      STATE.notifications.unshift({ id:uid('NTF'), role:'therapist', userId:req.therapistId, type:'device', tone:'good', icon:'check', title:'Device cleared for use', desc:`Your requested ${deviceType(req.deviceTypeId).name} has been cleared by ${STATE.currentUser.name}.`, time:new Date(TODAY), read:false, link:{page:'devices'} });
      STATE.auditLog.unshift({ id:uid('AUD'), user:STATE.currentUser.name, role:STATE.currentUser.role, action:'Device Cleared', entity:'Device Request', entityId:req.id, timestamp:new Date(TODAY) });
      toast('Device cleared and ready to assign.','good');
    }});
};
window.investigateIssue = function(id){
  const i = getIssue(id);
  askConfirm({ title:'Begin Investigation', tone:'info', confirmLabel:'Start Investigation',
    body:`Mark this issue on ${i.deviceId} as under investigation. You will be recorded as the assigned engineer.`,
    action: ()=>{
      i.status='Investigating'; i.engineerId = STATE.currentUser.id;
      i.troubleshooting = i.troubleshooting||[]; i.troubleshooting.push({ at:new Date(TODAY), by:STATE.currentUser.name, text:'Investigation started; running diagnostic sweep.' });
      const d = getDevice(i.deviceId); d.status='Awaiting Engineer';
      d.history.push({ date:new Date(TODAY), type:'investigating', text:`${STATE.currentUser.name} began investigation.` });
      toast('Investigation started on '+i.deviceId+'.','info');
    }});
};
window.resolveIssueFlow = function(id){
  const i = getIssue(id);
  askConfirm({ title:'Resolve Device Issue', tone:'warning', confirmLabel:'Mark Resolved', needReason:true,
    body:`Record the resolution for the issue on ${i.deviceId}. This will preserve the full troubleshooting record and require verification before the device is cleared.`,
    action: (reason)=>{
      i.status='Resolved'; i.resolution = reason; i.resolvedAt = new Date(TODAY);
      i.troubleshooting.push({ at:new Date(TODAY), by:STATE.currentUser.name, text: reason });
      const d = getDevice(i.deviceId); d.history.push({ date:new Date(TODAY), type:'resolved', text:`Issue resolved by ${STATE.currentUser.name}: ${reason}` });
      STATE.auditLog.unshift({ id:uid('AUD'), user:STATE.currentUser.name, role:STATE.currentUser.role, action:'Issue Resolved', entity:'Device Issue', entityId:i.id, timestamp:new Date(TODAY), prev:'Investigating', new:'Resolved', notes:reason });
      toast('Issue marked resolved. Verify and clear the device to return it to service.','good');
      setTimeout(()=>askClearDevice(i.id), 350);
    }});
};
function askClearDevice(issueId){
  const i = getIssue(issueId);
  askConfirm({ title:'Verify & Clear Device', tone:'good', confirmLabel:'Clear Device',
    body:`Verify the resolution and clear ${i.deviceId} for return to active patient use.`,
    action: ()=>{
      i.status='Cleared'; i.clearedAt=new Date(TODAY); i.verifiedBy = STATE.currentUser.name;
      const d = getDevice(i.deviceId); d.status='Available';
      d.history.push({ date:new Date(TODAY), type:'cleared', text:`Device cleared for patient use by ${STATE.currentUser.name}.` });
      STATE.auditLog.unshift({ id:uid('AUD'), user:STATE.currentUser.name, role:STATE.currentUser.role, action:'Device Cleared', entity:'Device', entityId:d.id, timestamp:new Date(TODAY) });
      toast(d.id+' cleared and returned to service.','good');
    }});
}

        <div class="form-grid">
          <div class="field"><label>Device</label>${fixedDevice

            : `<select id="ri-device">${devices.map(d=>`<option value="${d.id}">${d.id} — ${esc(deviceType(d.typeId).name)}${d.currentPatientId?' · '+esc(getPatient(d.currentPatientId).name):''}</option>`).join('')}</select>`}</div>

      </div>
      <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitReportIssue()">${ic('alert','',14)} Report Issue</button></div>

window.submitReportIssue = function(){
  const deviceId = document.getElementById('ri-device').value;
  const d = getDevice(deviceId);
  const severity = document.getElementById('ri-severity').value;
  const typeSel = document.getElementById('ri-type').value;
  const freeText = document.getElementById('ri-desc').value.trim();
  const description = (typeSel==='__other' || !typeSel) ? (freeText || 'Device issue reported by staff.') : (freeText? typeSel+' — '+freeText : typeSel);
  const engineers = usersByRole('engineer');
  const engineer = engineers[STATE.issues.length % engineers.length];
  const issue = {
    id: uid('ISS'), deviceId: d.id, description, severity, status:'Open',
    openedAt: new Date(TODAY), openedBy: STATE.currentUser.id, engineerId: engineer.id,
    diagnostics:null, troubleshooting:[], partsReplaced:null, resolution:null, resolvedAt:null, clearedAt:null, verifiedBy:null,
  };
  STATE.issues.unshift(issue);
  d.status='Issue Detected';
  d.history.push({ date:new Date(TODAY), type:'issue', text:`Issue reported (${severity}) by ${STATE.currentUser.name}: ${description}` });
  STATE.notifications.unshift({ id:uid('NTF'), role:'engineer', userId:null, type:'issue', tone: severity==='Critical'?'critical':'warning', icon:'alert', title:'New device issue reported', desc:`${STATE.currentUser.name} reported a ${severity.toLowerCase()}-severity issue on ${d.id}: ${description}`, time:new Date(TODAY), read:false, link:{page:'issues'} });
  STATE.auditLog.unshift({ id:uid('AUD'), user:STATE.currentUser.name, role:STATE.currentUser.role, action:'Issue Reported', entity:'Device', entityId:d.id, timestamp:new Date(TODAY), prev:null, new:severity+' — '+description });
  toast('Issue reported for '+d.id+'. Engineering has been notified.','warning');
  closeModal(); App_go('#/issues');
};

STATE.analyticsFilter = { therapist:'all', device:'all', status:'all' };
function renderAnalyticsPage(){
  PAGE_CHART_HOOK = null;
  const af = STATE.analyticsFilter;
  let patients = visiblePatients();
  if(af.therapist!=='all') patients = patients.filter(p=>p.therapistId===af.therapist);
  if(af.status!=='all') patients = patients.filter(p=>p.status===af.status);
  if(af.device!=='all') patients = patients.filter(p=>(p.deviceTypesUsed||[]).includes(af.device));

  const totalSessions = patients.reduce((s,p)=>s+(p.sessions||[]).length,0);
  const totalHours = Math.round(patients.reduce((s,p)=>s+(p.sessions||[]).reduce((x,ss)=>x+ss.durationMin,0),0)/60);
  const avgAdherence = Math.round(patients.filter(p=>currentPlan(p)).reduce((s,p)=>s+planProgress(currentPlan(p)).adherence,0)/(patients.filter(p=>currentPlan(p)).length||1));
  const improved = patients.filter(p=>{ const a=p.assessments; return a&&a.length>1 && a[a.length-1].percentage>a[0].percentage; }).length;
