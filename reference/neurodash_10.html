    <select class="filter-select" onchange="analyticsFilterUpdate('device',this.value)"><option value="all">All device types</option>${DEVICE_TYPES.map(d=>`<option value="${d.id}" ${af.device===d.id?'selected':''}>${d.name}</option>`).join('')}</select>
    <select class="filter-select" onchange="analyticsFilterUpdate('status',this.value)"><option value="all">All statuses</option>${['New','Assessment Pending','Active','Paused','Completed','Discontinued'].map(s=>`<option value="${s}" ${af.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <span class="muted" style="font-size:12px;margin-left:auto">${patients.length} patients matched</span>
  </div>
  <div class="grid grid-4" style="margin-bottom:18px">
    ${kpiCard('Therapy Hours', totalHours+'h','clock','info')}
    ${kpiCard('Total Sessions', totalSessions,'activity','accent')}
    ${kpiCard('Avg. Adherence', avgAdherence+'%','target', avgAdherence>=75?'good':'warning')}
    ${kpiCard('Improving Patients', improved,'trend','good')}
  </div>
  <div class="two-col" style="margin-bottom:16px">
    ${inflowChartBlock('chart-inflow-an', STATE.overviewRange, 'setOverviewRange')}
    <div class="card"><div class="card-head"><h3>Device utilization by type</h3></div><div class="card-body">${(function(){ const u=deviceUtilByType(); PAGE_CHART_HOOK=chainHook(PAGE_CHART_HOOK,()=>barChart('chart-devtype-an', u.map(x=>x.type.name), [{label:'Utilization %', data:u.map(x=>x.pct), color:cssVar('--accent')}], {suggestedMax:100})); return `<div class="chart-box" style="height:210px"><canvas id="chart-devtype-an"></canvas></div>`; })()}</div></div>
  </div>
  <div class="two-col">
    <div class="card"><div class="card-head"><h3>Patient status distribution</h3></div><div class="card-body">${statusDonutBlock('chart-status-an', patients)}</div></div>
    <div class="card"><div class="card-head"><h3>Assessment score improvement</h3><span class="hint">Baseline vs latest, average %</span></div><div class="card-body">${(function(){
      const withA = patients.filter(p=>p.assessments&&p.assessments.length>1);
      const baseline = Math.round(withA.reduce((s,p)=>s+p.assessments[0].percentage,0)/(withA.length||1));
      const latest = Math.round(withA.reduce((s,p)=>s+p.assessments[p.assessments.length-1].percentage,0)/(withA.length||1));
      PAGE_CHART_HOOK = chainHook(PAGE_CHART_HOOK, ()=>barChart('chart-improve-an', ['Baseline','Latest'], [{label:'Avg score %', data:[baseline,latest], color:cssVar('--series-3')}], {suggestedMax:100}));
      return `<div class="chart-box" style="height:210px"><canvas id="chart-improve-an"></canvas></div>`;
    })()}</div></div>
  </div>`;
}

function aiSuggestedPrompts(){
  const role = STATE.currentUser.role;
  const p0 = visiblePatients()[0];
  if(role==='engineer') return ['Which devices currently have unresolved issues?','Which devices have the highest utilization?','Which device is underutilized?','How many issues were opened this month?'];
  if(role==='admin') return ['What is overall device utilization?','How many patients are actively receiving therapy?','Which patients have low plan adherence?','How many therapy hours were delivered this month?'];
  const name = p0? p0.name.split(' ')[0] : 'a patient';
  return [`How has ${name} improved?`, `Which device did ${name} use the most?`, `Is ${name} following the therapy plan?`, 'Which patients have low plan adherence?'];
}
function renderAIPage(){
  PAGE_CHART_HOOK = null;
  if(!STATE.aiMessages.length){
    STATE.aiMessages.push({ role:'bot', html: `<p>Hello ${esc(STATE.currentUser.name.split(' ').slice(-1)[0])} — I'm the NeuroDash clinical data assistant. I can answer questions about ${STATE.currentUser.role==='engineer'?'device status, utilization and issues':'patient progress, assessments, therapy plans and device usage'} within your authorized data scope. I'll always tell you when data is observed, calculated, or a clinical interpretation — and I won't guess when data isn't available.</p>` });
  }
  return `
  <div class="page-head"><div><h1>AI Assistant</h1><div class="sub">Ask questions about ${STATE.currentUser.role==='engineer'?'device operations':'patients and therapy data'} — answers are scoped to what your role is authorized to see.</div></div></div>
  <div class="ai-shell">
    <div class="ai-suggest">
      <div class="eyebrow" style="margin-bottom:4px">Suggested</div>
      ${aiSuggestedPrompts().map(q=>`<button onclick="askAI(${JSON.stringify(q).replace(/"/g,'&quot;')})">${esc(q)}</button>`).join('')}
      <div class="alert alert-info" style="margin-top:16px">${ic('shield','',14)}<span>Scoped to your role: <b>${STATE.currentUser.role}</b>. ${STATE.currentUser.role==='admin'?'Full visibility, read-only.':STATE.currentUser.role==='engineer'?'Device & operational data only.':'Your authorized patients only.'}</span></div>
    </div>
    <div class="chat-col">
      <div class="chat-log hidden-scroll" id="chat-log">
        ${STATE.aiMessages.map(m=> m.role==='user' ? `<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>` : `<div class="msg bot"><div class="bubble">${m.html}</div></div>`).join('')}
        ${STATE.aiTyping? `<div class="msg bot"><div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div></div>`:''}
      </div>
      <form class="chat-input-row" onsubmit="submitAIQuestion(event)">
        <input type="text" id="ai-input" placeholder="Ask about a patient, device, or program metric…" autocomplete="off">
        <button type="submit" class="btn btn-primary">${ic('send','',15)}</button>
      </form>
    </div>
  </div>`;
}
window.submitAIQuestion = function(e){ e.preventDefault(); const el = document.getElementById('ai-input'); const v = el.value.trim(); if(!v) return; el.value=''; askAI(v); };
window.askAI = function(q){
  STATE.aiMessages.push({ role:'user', text:q });
  STATE.aiTyping = true; render(); scrollChatBottom();
  setTimeout(()=>{ STATE.aiTyping=false; STATE.aiMessages.push({ role:'bot', html: aiAnswer(q) }); render(); scrollChatBottom(); }, 650);
};
function scrollChatBottom(){ const el=document.getElementById('chat-log'); if(el) el.scrollTop = el.scrollHeight; }
function aiTag(kind){ return `<span class="ai-tag ${kind}">${kind}</span>`; }
function aiCardActions(links){ return `<div class="ai-actions">${links.map(l=>`<button class="btn btn-secondary btn-sm" onclick="App_go('${l.href}')">${ic(l.icon,'',12)} ${esc(l.label)}</button>`).join('')}</div>`; }

function findMentionedPatient(q){
  const ql = q.toLowerCase();
  const scope = visiblePatients();
  let found = scope.find(p=>ql.includes(p.id.toLowerCase()));
  if(found) return found;
  found = scope.find(p=>ql.includes(p.name.toLowerCase().split(' ')[0].toLowerCase()));
  return found;
}
function aiAnswer(q){
  const role = STATE.currentUser.role;
  const ql = q.toLowerCase();

  if(role==='engineer'){
    if(ql.includes('unresolved') || ql.includes('unresolved issues') || (ql.includes('issue')&&ql.includes('device'))){
      const open = STATE.issues.filter(i=>!['Cleared','Resolved'].includes(i.status));
      if(!open.length) return `<p>${aiTag('observed')} There are currently no unresolved device issues in the fleet.</p>`;
      return `<p>${aiTag('observed')} <b>${open.length} device${open.length!==1?'s have':' has'}</b> unresolved issues right now:</p>
        <div class="ai-card"><div class="ai-card-head">Open Issues</div><div style="padding:10px 12px">${open.map(i=>`<div class="kv-row" style="margin-bottom:6px"><span class="kl">${i.deviceId} — ${esc(i.description.slice(0,44))}…</span>${badge(i.severity)}</div>`).join('')}</div></div>
        ${aiCardActions([{href:'#/issues',icon:'alert',label:'View Issue Queue'}])}`;
    }
    if(ql.includes('utiliz') && ql.includes('high')){
      const util = deviceUtilByType().sort((a,b)=>b.pct-a.pct)[0];
      return `<p>${aiTag('calculated')} <b>${util.type.name}</b> (${util.type.category}) has the highest utilization at <b>${util.pct}%</b> (${util.inUse}/${util.units} units in use).</p>${aiCardActions([{href:'#/usage',icon:'bar',label:'View Device Usage'}])}`;
    }
    if(ql.includes('underutil') || (ql.includes('utiliz')&&(ql.includes('low')||ql.includes('under')))){
      const util = deviceUtilByType().sort((a,b)=>a.pct-b.pct)[0];
      return `<p>${aiTag('calculated')} <b>${util.type.name}</b> is currently the most underutilized device type at <b>${util.pct}%</b> utilization.</p>${aiCardActions([{href:'#/usage',icon:'bar',label:'View Device Usage'}])}`;
    }
    if(ql.includes('issue') && (ql.includes('month')||ql.includes('opened'))){
      const n = STATE.issues.filter(i=>daysBetween(i.openedAt,new Date(TODAY))<=30).length;
      return `<p>${aiTag('observed')} <b>${n}</b> device issues were opened in the last 30 days across the fleet.</p>${aiCardActions([{href:'#/issues',icon:'alert',label:'View Issue Queue'}])}`;
    }
    return `<p>${aiTag('interpretation')} I can answer questions about device status, utilization, issues and maintenance. As an engineer account, I don't surface patient clinical details beyond what's needed for device context. Try: "Which devices have unresolved issues?"</p>`;
  }

  if(ql.includes('low plan adherence') || (ql.includes('adherence')&&ql.includes('low')) || (ql.includes('which patients')&&ql.includes('adherence'))){
    const scope = visiblePatients();
    const low = scope.filter(p=>{ const pl=currentPlan(p); return pl && planProgress(pl).adherence<65; });
    if(!low.length) return `<p>${aiTag('observed')} No patients in your scope currently have plan adherence below 65%.</p>`;
    return `<p>${aiTag('calculated')} <b>${low.length}</b> patient${low.length!==1?'s':''} currently ${low.length!==1?'have':'has'} plan adherence below 65%:</p>
    <div class="ai-card"><div class="ai-card-head">At-Risk Adherence</div><div style="padding:10px 12px">${low.map(p=>`<div class="kv-row" style="margin-bottom:6px"><span class="kl">${esc(p.name)} (${p.id})</span><span class="kv">${planProgress(currentPlan(p)).adherence}%</span></div>`).join('')}</div></div>
    ${aiCardActions(low.slice(0,1).map(p=>({href:'#/patientprofile/'+p.id,icon:'users',label:'View '+p.name.split(' ')[0]})))}`;
  }
  if(ql.includes('utilization') && (role==='admin')){
    const fs = fleetSummary();
    return `<p>${aiTag('calculated')} Fleet-wide device utilization is currently <b>${fs.utilization}%</b> (${fs.inUse} of ${fs.total} devices in active use).</p>${aiCardActions([{href:'#/devices',icon:'device',label:'View Devices'}])}`;
  }
  if(ql.includes('actively receiving') || (ql.includes('how many patients')&&ql.includes('active'))){
    const prog = programSummary();
    return `<p>${aiTag('observed')} <b>${prog.active}</b> of ${prog.total} patients are currently in an Active therapy status.</p>${aiCardActions([{href:'#/patients',icon:'users',label:'View Patients'}])}`;
  }
  if(ql.includes('therapy hours') && ql.includes('month')){
    const prog = programSummary();
    return `<p>${aiTag('calculated')} Approximately <b>${prog.totalHours} hours</b> of device-assisted therapy have been delivered across the program to date.</p>`;
  }

  const patient = findMentionedPatient(q);
  if(patient){
    if(STATE.currentUser.role==='therapist' && patient.therapistId!==STATE.currentUser.id){
      return `<p>${aiTag('interpretation')} I can't share details for ${esc(patient.name)} — this patient is not assigned to you. Access is limited to your own patients.</p>`;
    }
    const st = patientStats(patient);
    if(ql.includes('improv')){
      if(!st.baselineAssessment) return `<p>${aiTag('observed')} No assessments have been recorded yet for ${esc(patient.name)}, so I can't report on improvement. A baseline assessment is needed first.</p>`;
      const delta = st.latestAssessment.score - st.baselineAssessment.score;
      return `<p>${aiTag('calculated')} <b>${esc(patient.name)}</b> has ${delta>=0?'shown improvement':'shown a decline'} in ${assessmentType(st.baselineAssessment.typeId).name} score.</p>
      <div class="ai-card"><div class="ai-card-head">${assessmentType(st.baselineAssessment.typeId).name}</div>
        <div class="ai-stat-grid">
          <div class="ai-stat"><div class="l">Baseline</div><div class="v">${st.baselineAssessment.score}/${st.baselineAssessment.maxScore}</div></div>
          <div class="ai-stat"><div class="l">Latest</div><div class="v">${st.latestAssessment.score}/${st.latestAssessment.maxScore}</div></div>
          <div class="ai-stat"><div class="l">Change</div><div class="v" style="color:${delta>=0?'var(--good)':'var(--critical)'}">${delta>=0?'+':''}${delta} pts</div></div>
          <div class="ai-stat"><div class="l">Adherence</div><div class="v">${st.prog?st.prog.adherence+'%':'—'}</div></div>
          <div class="ai-stat"><div class="l">Sessions</div><div class="v">${st.sessionsCount}</div></div>
          <div class="ai-stat"><div class="l">Primary device</div><div class="v" style="font-size:13px">${st.devicesUsed[0]||'—'}</div></div>
        </div></div>
      ${aiCardActions([{href:'#/patientprofile/'+patient.id+'?tab=assessments',icon:'clipboard',label:'View Assessments'},{href:'#/patientprofile/'+patient.id,icon:'users',label:'View Patient'}])}`;
    }
    if(ql.includes('fma') || ql.includes('baseline')){
      const fma = (patient.assessments||[]).filter(a=>a.typeId==='FMA');
      if(!fma.length) return `<p>${aiTag('observed')} No FMA assessments are on record for ${esc(patient.name)}.</p>`;
      return `<p>${aiTag('observed')} ${esc(patient.name)}'s FMA score at baseline was <b>${fma[0].score}/${fma[0].maxScore}</b>, and the most recent recorded score is <b>${fma[fma.length-1].score}/${fma[fma.length-1].maxScore}</b>.</p>${aiCardActions([{href:'#/patientprofile/'+patient.id+'?tab=assessments',icon:'clipboard',label:'View Assessments'}])}`;
    }
    if(ql.includes('device') && ql.includes('most')){
      if(!st.devicesUsed.length) return `<p>${aiTag('observed')} No device sessions are recorded yet for ${esc(patient.name)}.</p>`;
      const byTime = {}; (patient.sessions||[]).forEach(s=>byTime[s.deviceId]=(byTime[s.deviceId]||0)+s.durationMin);
      const top = Object.entries(byTime).sort((a,b)=>b[1]-a[1])[0];
      return `<p>${aiTag('calculated')} ${esc(patient.name)} has used <b>${top[0]}</b> (${deviceType(getDevice(top[0]).typeId).category}) the most, totalling <b>${fmtHrsFromMin(top[1])}</b> of therapy time.</p>${aiCardActions([{href:'#/devicedetail/'+top[0],icon:'device',label:'View Device'},{href:'#/patientprofile/'+patient.id+'?tab=devices',icon:'device',label:'Patient Device Usage'}])}`;
    }
    if(ql.includes('therapy hours') && ql.includes('week')){
      const min = (patient.sessions||[]).filter(s=>daysBetween(s.date,new Date(TODAY))<=6).reduce((s,x)=>s+x.durationMin,0);
      return `<p>${aiTag('observed')} ${esc(patient.name)} completed <b>${fmtHrsFromMin(min)}</b> of therapy in the last 7 days.</p>`;
    }
    if(ql.includes('game') && ql.includes('long')){
      const gameTime = {}; (patient.sessions||[]).forEach(s=>s.trials.forEach(t=>{ if(t.game){ const dur=(new Date(t.stopTime)-new Date(t.startTime))/60000; gameTime[t.game]=(gameTime[t.game]||0)+dur; } }));
      if(!Object.keys(gameTime).length) return `<p>${aiTag('observed')} No game-mode trials recorded for ${esc(patient.name)} yet.</p>`;
      const top = Object.entries(gameTime).sort((a,b)=>b[1]-a[1])[0];
      return `<p>${aiTag('calculated')} ${esc(patient.name)} has spent the most time playing <b>${GAME_LABELS[top[0]]||top[0]}</b> — approximately ${fmtMin(top[1])} across all sessions.</p>`;
    }
    if(ql.includes('mechanism')){
      const mechMap = {}; (patient.sessions||[]).forEach(s=>s.trials.forEach(t=>mechMap[t.mechanism]=(mechMap[t.mechanism]||0)+1));
      const top = Object.entries(mechMap).sort((a,b)=>b[1]-a[1])[0];
      if(!top) return `<p>${aiTag('observed')} No trial data recorded yet for ${esc(patient.name)}.</p>`;
      return `<p>${aiTag('calculated')} The most-used mechanism for ${esc(patient.name)} is <b>${esc(top[0])}</b> (${top[1]} trials recorded).</p>`;
    }
    if(ql.includes('following') || ql.includes('adherence') || ql.includes('plan')){
      if(!st.plan) return `<p>${aiTag('observed')} ${esc(patient.name)} does not currently have an active therapy plan.</p>`;
      const tone = st.prog.adherence>=85?'is closely following':st.prog.adherence>=65?'is generally following, with some gaps in':'is not consistently following';
      return `<p>${aiTag('interpretation')} Based on logged sessions, ${esc(patient.name)} <b>${tone}</b> the current therapy plan.</p>
      <div class="ai-card"><div class="ai-card-head">${esc(st.plan.name)}</div><div class="ai-stat-grid">
        <div class="ai-stat"><div class="l">Adherence</div><div class="v">${st.prog.adherence}%</div></div>
        <div class="ai-stat"><div class="l">Day</div><div class="v">${st.prog.currentDay}/${st.plan.durationDays}</div></div>
        <div class="ai-stat"><div class="l">Missed days</div><div class="v">${st.prog.missedDays}</div></div>
      </div></div>${aiCardActions([{href:'#/patientprofile/'+patient.id+'?tab=plan',icon:'target',label:'View Plan'}])}`;
    }
    // default patient summary
    return `<p>${aiTag('observed')} Here's a snapshot for <b>${esc(patient.name)}</b> (${patient.id}):</p>
    <div class="ai-card"><div class="ai-card-head">Patient Snapshot</div><div class="ai-stat-grid">
      <div class="ai-stat"><div class="l">Status</div><div class="v" style="font-size:13px">${patient.status}</div></div>
      <div class="ai-stat"><div class="l">Adherence</div><div class="v">${st.prog?st.prog.adherence+'%':'—'}</div></div>
      <div class="ai-stat"><div class="l">Sessions</div><div class="v">${st.sessionsCount}</div></div>
      <div class="ai-stat"><div class="l">Avg Accuracy</div><div class="v">${st.avgAccuracy}%</div></div>
      <div class="ai-stat"><div class="l">Therapy Time</div><div class="v" style="font-size:13px">${fmtHrsFromMin(st.totalMin)}</div></div>
      <div class="ai-stat"><div class="l">Latest Score</div><div class="v" style="font-size:13px">${st.latestAssessment?st.latestAssessment.percentage+'%':'—'}</div></div>
    </div></div>${aiCardActions([{href:'#/patientprofile/'+patient.id,icon:'users',label:'View Patient'}])}`;
  }

  return `<p>${aiTag('interpretation')} I couldn't confidently match that to a patient or metric in your authorized data. I answer questions grounded in NeuroDash records only — I don't fabricate data that isn't present. Try naming a patient (e.g. "How has Ananya R. improved?") or asking about adherence, devices, or utilization.</p>`;
}

    <div class="notif-item ${n.read?'':'unread'}" onclick="openNotif('${n.id}')" style="padding:16px 18px">
      <div class="notif-ic" style="background:var(--${n.tone}-soft, var(--surface-3));color:var(--${n.tone}, var(--ink-700))">${ic(n.icon,null,16)}</div>
      <div style="flex:1"><div class="notif-title" style="font-size:13.5px">${esc(n.title)}</div><div class="notif-desc" style="font-size:12.5px">${esc(n.desc)}</div><div class="notif-time">${fmtDateTime(n.time)}</div></div>
    </div>`).join('') : emptyState('bell','No notifications','')}
  </div>`;
}
window.setNotifFilter = function(f){ STATE.notifFilter = f; render(); };

/* ============================================================
   AUDIT LOG (Admin)
   ============================================================ */
STATE.auditFilter = { action:'all', role:'all' };
function renderAuditPage(){
  PAGE_CHART_HOOK = null;
  const f = STATE.auditFilter;
  let list = STATE.auditLog.slice();
  if(f.action!=='all') list = list.filter(a=>a.action===f.action);
  if(f.role!=='all') list = list.filter(a=>a.role===f.role);
  const actions = [...new Set(STATE.auditLog.map(a=>a.action))];
  return `
  <div class="page-head"><div><h1>Audit Log</h1><div class="sub">Immutable record of clinical and system activity, for compliance and oversight.</div></div></div>
  <div class="card card-pad" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap">
    <select class="filter-select" onchange="auditFilterUpdate('action',this.value)"><option value="all">All actions</option>${actions.map(a=>`<option value="${a}" ${f.action===a?'selected':''}>${a}</option>`).join('')}</select>
    <select class="filter-select" onchange="auditFilterUpdate('role',this.value)"><option value="all">All roles</option>${['therapist','consultant','engineer','admin'].map(r=>`<option value="${r}" ${f.role===r?'selected':''}>${r}</option>`).join('')}</select>
    <span class="muted" style="font-size:12px;margin-left:auto;align-self:center">${list.length} events</span>
  </div>
  <div class="card"><div class="table-wrap"><table class="dt"><thead><tr><th>Timestamp</th><th>User</th><th>Role</th><th>Action</th><th>Entity</th><th>Previous</th><th>New</th></tr></thead><tbody>
  ${list.length? list.map(a=>`<tr><td class="mono">${fmtDateTime(a.timestamp)}</td><td class="dt-name">${esc(a.user)}</td><td>${badge(a.role,'neutral')}</td><td>${esc(a.action)}</td><td class="mono">${esc(a.entity)}${a.entityId&&a.entityId!=='—'?' · '+esc(a.entityId):''}</td><td class="mono muted">${a.prev?esc(a.prev):'—'}</td><td class="mono">${a.new?esc(a.new):'—'}</td></tr>`).join('') : `<tr><td colspan="7">${emptyState('history','No audit events match your filters','')}</td></tr>`}
  </tbody></table></div></div>`;
}
window.auditFilterUpdate = function(k,v){ STATE.auditFilter[k]=v; render(); };

/* ============================================================
   PROFILE
   ============================================================ */
function renderProfilePage(){
  PAGE_CHART_HOOK = null;
  const u = STATE.currentUser;
  const perms = {
    therapist: ['View & create your own patients','Enter and edit clinical assessments','Create and modify your own therapy plans','Request and assign cleared devices','Full analytics & reports for your patients','AI Assistant — your patients only'],
    consultant: ['View all patients (read-only)','View assessments (read-only, cannot create/edit)','Modify therapy plans','View sessions, devices & reports','AI Assistant — program-wide clinical scope'],
    engineer: ['View devices in your engineering scope','Open, investigate & resolve device issues','Mark devices cleared','View device usage, maintenance & history','No access to clinical assessment detail'],
    admin: ['View all patients, users, devices & sessions','View audit log & system activity','Read-only — cannot create or modify clinical records, plans, or device issue resolutions','AI Assistant — full scope, read-only'],
  };
  return `
  <div class="page-head"><div><h1>My Profile</h1></div></div>
  <div class="card card-pad" style="margin-bottom:18px;display:flex;gap:18px;align-items:center">
    <div class="ph-av" style="width:64px;height:64px;font-size:22px">${u.initials}</div>
    <div><div style="font-size:18px;font-weight:700;font-family:var(--font-display)">${esc(u.name)}</div><div class="muted" style="margin-top:2px">${esc(u.title)}</div><div class="mono muted" style="font-size:12px;margin-top:4px">${esc(u.email)}</div></div>
    <div style="margin-left:auto">${badge(u.role.charAt(0).toUpperCase()+u.role.slice(1),'accent')}</div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Your permissions</h3><span class="hint">Enforced by role — provisioned by your system administrator</span></div>
    <div class="card-body"><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:9px">${perms[u.role].map(p=>`<li style="font-size:13px;color:var(--ink-700)">${esc(p)}</li>`).join('')}</ul></div>
  </div>`;
}

/* ============================================================
   BOOT
   ============================================================ */
STATE.route = parseHash();
render();
</script>
